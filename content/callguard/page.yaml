# 프로젝트 소개 페이지 v2 (시범) — 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 120 다산콜센터 상담원이 통화하는 동안 고객의 말을 자막으로 띄우고, 그 민원에 필요한 규정과 구비서류를 옆 화면에 자동으로 보여 주는 서비스입니다.
  role: 4인 팀에서 서버와 개인정보 마스킹 기능을 맡았습니다.
  why: 상담원이 통화 중에 규정을 찾느라 고객을 기다리게 하지 않는 것이 목표입니다. 자막에 주민번호나 전화번호가 나오면 검색과 저장 전에 마스킹합니다. 저장하는 자막은 한 번 더 암호화합니다(배포 전).
  highlights:
    - { value: "3건 → 0건", label: 놓친 개인정보, note: "제가 구현한 날 골든셋의 마스킹 문항 10건 기준. 팀원이 규칙을 보강한 뒤의 최종 측정(문항 36개, 개인정보 패턴 40개, 팀원 측정)에서도 0건" }
    - { value: "0.853 → 0.971", label: 검색 정확도(Recall@5), note: "키워드 검색만 쓸 때와 벡터 검색을 쓸 때, 팀원 측정" }
    - { value: "1,472개", label: 서버 자동 테스트, note: "2026년 10월 6일 제 마지막 커밋 때 팀 전체 기록" }

features:
  - title: 필요한 서류 자동 추천
    body: 고객의 말이 한 문장으로 끝나면 그 민원에 맞는 다산콜센터 규정과 구비서류를 찾아 카드로 띄웁니다. 상담원이 따로 검색하지 않아도 됩니다.
    core: true
    image: media/f-recommend.webp
  - title: 개인정보 자동 가림
    body: 자막에 주민번호, 전화번호, 카드번호, 주소가 나오면 검색과 저장 전에 마스킹합니다. 10월 6일에는 상담원 화면에 원문을 보여 주되 개인정보 자리를 강조하고, 저장하는 자막은 한 번 더 암호화하도록 바꿨습니다(배포 전, 사진은 바꾸기 전 화면). 마스킹은 제가 처음 구현했고, 이름과 주소 규칙은 팀원이 보강했습니다.
    core: true
    image: media/03-1.webp
  - title: 실시간 자막
    body: Google 음성 인식으로 통화를 자막으로 바꾸고, 고객과 상담원의 말을 나눠 보여 줍니다. 말이 들어오는 대로 어떤 민원인지도 함께 짚어 줍니다.
    image: media/f-subtitle.webp
  - title: 상담 발언 점검
    body: "\"무조건 환불됩니다\"처럼 약속하면 안 되는 표현이나 빠뜨린 필수 안내를 찾아 상담원에게 알려 주고, 바꿔 말할 표현을 제안합니다."
    image: media/f-compliance.webp
  - title: 통화 후 정리
    body: 통화가 끝나면 상담 내용을 요약하고 후속 조치 항목을 뽑아 줍니다. 리포트도 개인정보가 마스킹된 상태로 만들어집니다.
    image: media/f-summary.webp
  - title: 외국인 고객 동시 통번역
    body: 고객이 영어 등 외국어로 말하면 한국어로 바로 옮겨 상담원 화면에 띄우고, 상담원의 답도 고객의 언어로 전달합니다. 번역된 문장에도 같은 마스킹 규칙이 적용됩니다.
    image: media/f-translate.webp
  - title: 격앙된 고객 감지
    body: 고객이 격앙되거나 절망적인 표현을 쓰면 신호를 잡아 관리자에게 알리고, 상담원에게 권장 대응 순서를 보여 줍니다.
    image: media/f-crisis.webp
featureNote: 데모 사이트는 브라우저 안에서만 도는 시연 화면이라 실제 통화 내용이 서버로 가지 않습니다.

architecture:
  image: media/arch.svg
  summary: 통화 음성은 자막이 되어 서버로 들어오고, 서버는 먼저 개인정보를 마스킹한 뒤에야 문서 검색, 발언 점검, 저장으로 넘깁니다.
  points:
    - title: 개인정보를 마스킹한 뒤에만 다음 단계로
      body: 마스킹 단계를 흐름의 맨 앞에 두었습니다. 그래서 그 뒤의 검색, 발언 점검, 저장은 모두 마스킹된 자막만 받습니다. 마스킹 기능이 준비되지 않으면 서버는 자막을 아예 받지 않습니다.
    - title: 서버와 검색을 나눠서 동시에 개발
      body: 요청을 처리하는 서버(server)와 검색 모델을 다루는 부분(ai)을 두 사람이 동시에 만들었습니다. 서버가 검색 코드를 직접 가져다 쓰지 못하게 검사 도구(import-linter)로 막아서, 한쪽을 고쳐도 다른 쪽이 깨지지 않게 했습니다.
    - title: 말이 끝났을 때만 검색
      body: 통화 중 자막은 20초 동안 199번이나 바뀝니다. 바뀔 때마다 검색하면 서버가 버겁고 화면의 카드도 계속 흔들립니다. 그래서 고객의 한 문장이 끝났을 때만 검색합니다.
    - title: 검색 방식은 직접 비교해 보고 골랐습니다
      body: 기획안은 키워드 검색과 벡터 검색을 합치는 하이브리드 검색이었습니다. 정답을 정해 둔 평가 문항인 골든셋으로 측정해 보니 벡터 검색 하나만 쓰는 쪽이 더 정확해서, 하이브리드 검색을 뺐습니다. 이 비교는 팀원이 측정했습니다.
    - title: 화면은 원문, 저장할 자막은 마스킹하고 암호화
      body: 상담원은 통화 당사자라 고객이 말한 번호를 이미 듣습니다. 화면에서 가리면 받아 적기만 어려워져서, 10월 6일 기획 변경에 맞춰 화면에는 원문을 보여 주되 개인정보 자리를 강조하게 바꿨습니다. 저장하는 자막은 마스킹한 뒤 AES-256-GCM으로 한 번 더 암호화합니다. 해시는 지난 통화를 다시 읽을 수 없게 만들고, DB 디스크 암호화만으로는 접속 권한이 샐 때 내용이 그대로 읽혀서 뺐습니다. 구현과 테스트는 마쳤고 아직 배포 전입니다.
  layers:
    - { name: 화면, items: [React, WebSocket] }
    - { name: 서버, items: [Python 3.13, FastAPI, import-linter] }
    - { name: 검색과 음성, items: [Elasticsearch 9 + nori, KoE5 임베딩, Google STT] }
    - { name: 데이터, items: [PostgreSQL] }
    - { name: 배포, items: [k3s, AWS] }

role:
  summary: 4명 중 백엔드와 AI를 팀원 한 명과 나눠 맡았고, 저는 요청이 흐르는 서버 쪽을 담당했습니다. 저장소에 남은 제 커밋은 116개입니다(2026년 8월 26일부터 10월 6일까지).
  mine:
    - 서버 뼈대 설계와 모듈 경계를 강제하는 import-linter 규칙
    - 개인정보 마스킹 기능의 첫 구현과 말하는 도중 자막의 숫자 마스킹 (착수 전 상태에서 넘겨받아 구현, 이름과 주소 규칙 보강은 팀원)
    - 상담원 화면은 원문으로, 저장하는 자막은 마스킹한 뒤 AES-256-GCM으로 암호화하도록 바꾼 설계와 구현 (10월 6일, 배포 전)
    - 자막에서 검색, 추천 카드까지 이어지는 흐름 연결
    - 팀원이 만든 WebSocket 게이트웨이 확장 (확정 자막이 도착한 시각을 추천 요청에 전달, 대시보드 실시간 알림 3종 켜기)
    - 평가 결과를 DB에 남기는 기록 체계
    - 통화 기록, 블랙리스트, 상담원 인증 API
    - 관리자와 상담원 기능에 로그인 없이 들어온 요청을 바로 돌려보내는 인증 검사
    - 규정 문서를 조항 단위로 나누는 작업(청킹)과 한국어 형태소 분석기(nori)를 넣은 Elasticsearch 이미지
    - AWS 운영 인프라 설계(GPU 서버 한 대 위의 k3s, 데이터베이스 RDS, 파일 저장소 S3)와 구축 절차서 (GPU 할당량이 0이라 실제 운영은 팀 결정으로 CPU 서버로 바뀜, 구축과 자동 배포는 팀원)
    - 운영 서버가 준비되기 전, 로컬 서버를 ngrok 터널로 열어 화면이 실제 서버 응답으로 먼저 연동되게 한 일
  collab:
    - 브랜치 4개로 나눠 작업하고, 모든 변경은 PR로 머지했습니다. 머지한 PR은 2026년 10월 2일 기준 161개입니다.
    - 처음에는 기능별로 나누지 않았다가, 코드가 server와 ai 두 폴더로 갈라진 날 "폴더 경계를 곧 담당 경계로 삼는다"고 정했습니다. 그런데 기능 하나가 여러 폴더에 걸쳐 미완성으로 남는 일이 이어져, 9월 10일에 이 잠금을 풀었습니다. 화면 폴더만 전담으로 두고 나머지는 누구나 고칩니다.
    - 설계를 정할 때마다 번호를 붙인 결정 문서로 남겼습니다. 저장소에 남은 결정 문서는 2026년 10월 2일 기준 122개입니다.
    - 진행 기록은 PR 본문이 아니라 팀 문서 사이트에 먼저 써서, PR이 닫혀도 기록이 남게 했습니다.
  ai:
    - Claude Code와 함께 개발했고, AI가 쓴 코드는 세 가지로 검증했습니다. 모듈 사이 규칙은 import-linter가, 기능은 서버 테스트 1,472개(2026년 10월 6일 제 마지막 커밋 때 팀 전체 기록)가, 품질은 골든셋 평가가 확인합니다.
    - 모듈 사이 규칙 검사와 평가 도구 테스트는 CI에서도 돌아서, 사람이 놓쳐도 머지 전에 걸립니다.
  team:
    - 검색 방식 비교 측정과 검색 시점 규칙
    - 이름과 주소를 찾는 NER 모델, 이름과 주소 마스킹 규칙 보강
    - 운영 서버 구성과 CI

troubles:
  - title: 멈춰 있던 개인정보 마스킹 기능을 넘겨받아 완성하기
    problem: 개인정보 마스킹은 원래 다른 팀원의 담당이었는데 착수 전 상태였습니다. 이 기능이 없으니 서버가 자막을 받지 못해 전체 흐름이 멈춰 있었습니다.
    solution: 제가 넘겨받았습니다. 일단 마스킹하지 않고 통과시키는 임시 방법은 보안 요구사항에 어긋나서 쓰지 않았습니다. 음성 인식은 숫자 사이의 하이픈과 띄어쓰기를 자주 무너뜨립니다. 그래서 구분 기호를 먼저 지우고, 한글로 읽은 숫자를 아라비아 숫자로 바꾼 뒤, 유형별 규칙으로 찾는 순서로 만들었습니다.
    detail: 만드는 도중에 "주소이고"의 "이"가 숫자 2로 바뀌어 번호가 뒤 글자까지 번지는 버그가 났습니다. 한글 숫자는 세 글자 이상 이어질 때만 숫자로 보도록 고쳤습니다.
    result: 골든셋의 마스킹 문항 10건에서 놓친 개인정보가 3건에서 0건이 되었습니다. 그 뒤 골든셋을 늘리면서 이름과 주소 규칙은 팀원이 보강했습니다. 팀원이 진행한 최종 측정에서는 골든셋의 마스킹 문항 36개(개인정보 패턴 40개)에서 놓친 것이 없었습니다.
    evidence:
      - { label: 개인정보 탐지 규칙 (pii_detector.py), url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/server/apps/masking/domain/services/pii_detector.py" }
      - { label: 한글 숫자 변환 (number_normalizer.py), url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/server/apps/masking/domain/services/number_normalizer.py" }
      - { label: 담당을 넘겨받은 결정 기록, url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/_project/decisions/019-C-5-%EB%8B%B4%EB%8B%B9-%EC%9D%B4%EA%B4%80.md" }
  - title: 말하는 도중의 자막에서 번호 앞자리가 새던 문제
    problem: 운영 표본 6건 중 5건에서, 말하는 도중에 뜨는 자막에 카드번호와 전화번호의 앞자리가 그대로 보였습니다.
    cause: 마스킹 규칙은 완성된 번호만 찾습니다. 아직 말하고 있는 7~8자리 숫자는 어느 규칙에도 맞지 않았습니다.
    solution: 완성본 규칙을 넓히면 금액이나 호수까지 마스킹됩니다. 그래서 말하는 도중의 자막에만 "세 자리 이상 숫자는 모두 가림"을 따로 얹었습니다. 이 자막은 곧 완성본으로 바뀌기 때문에 조금 넓게 마스킹해도 잃는 것이 잠깐뿐입니다.
    result: 저장되는 완성본 자막은 그대로 두면서 화면에 번호가 스치는 일을 막았습니다. 10월 6일 화면을 원문으로 바꾼 뒤로는 이 규칙이 화면에서 개인정보 자리를 강조하는 데 쓰입니다(배포 전).
    evidence:
      - { label: 말하는 도중 자막 숫자 마스킹 (interim_digit_guard.py), url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/server/apps/masking/domain/services/interim_digit_guard.py" }
      - { label: 숫자를 전부 마스킹하기로 한 결정 기록, url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/_project/decisions/324-C-5-%EC%A4%91%EA%B0%84-%EC%9E%90%EB%A7%89%EC%9D%80-3%EC%9E%90%EB%A6%AC-%EC%9D%B4%EC%83%81-%EC%88%AB%EC%9E%90%EB%A5%BC-%EC%A0%84%EB%B6%80-%EA%B0%80%EB%A6%B0%EB%8B%A4.md" }
  - title: "\"측정 불가\"만 나오던 평가를 숫자로 바꾸기"
    problem: 기능은 모두 만들었는데 평가 도구는 "측정 불가"만 보고했고, 결과도 화면에 찍히고 사라졌습니다.
    cause: 평가 스크립트에 실제 기능이 연결되어 있지 않았고, 결과를 저장하는 코드도 없었습니다.
    solution: 개인정보 마스킹과 서류 판정을 평가 도구에 연결했습니다. 이것이 프로젝트의 첫 통합 측정이었습니다. 결과는 DB에 남기되 여러 번 돌리면 가장 낮은 값만 적고, 아직 없는 기능은 0점으로 적지 않는다는 규칙을 정했습니다. 고쳤던 버그를 일부러 되돌려 점수가 떨어지는 것을 보고, 측정 장치가 제대로 도는지도 확인했습니다.
    result: 그 뒤로 모든 수치가 실행 번호, 코드 버전, 표본 수와 함께 남습니다. 검색 정확도 0.971도 팀원이 이 기록 체계로 측정한 값입니다.
    evidence:
      - { label: 실측 기록 (STATE.md), url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/_project/STATE.md" }
  - title: 저장이 실패해도 상담원 화면은 떠야 합니다
    problem: DB 저장이 실패했을 때 경로마다 동작이 달랐습니다. 문서 추천 경로는 오류를 내서, 저장 실패 때문에 상담원 화면의 추천 카드까지 사라졌습니다.
    solution: 규칙 하나로 정리했습니다. 결과가 상담원 화면에 나가는 경로는 저장이 실패해도 결과를 보여 주고 경고 로그만 남깁니다. 통화 기록 저장처럼 저장 자체가 목적인 경로는 오류를 그대로 냅니다. 조용히 성공이라고 답하면 저장된 줄 알고 넘어가기 때문입니다.
    result: 저장 장애가 상담 화면 장애로 번지지 않습니다. 지금은 실패가 경고 로그로 남으므로, 다음 단계는 이 경고를 알림으로 받아 바로 알아채게 하는 것입니다.
  - title: 운영 서버가 늦어져 화면과 서버를 합칠 곳이 없었습니다
    problem: 운영 서버 준비가 늦어지면서, 화면을 만드는 팀원이 실제 서버 응답을 받아 볼 곳이 없었습니다. 운영 서버에는 검색할 문서도 아직 들어 있지 않았습니다. 이대로면 화면은 가짜 데이터로만 만들어야 했습니다.
    solution: 제 컴퓨터에서 도는 로컬 서버를 ngrok 터널로 열어 임시 인터넷 주소를 만들었습니다. 열기 전에 직접 호출해 보니 통화를 만드는 주소가 없고, 데이터베이스 주소가 반영되지 않고, 추천 요청이 오류를 내는 세 곳이 막혀 있어 먼저 고쳤습니다. 화면이 브라우저에서 바로 부를 수 있게 접속 허용 주소(CORS)를 열고, 주소와 호출 순서는 인계 문서로 정리해 넘겼습니다.
    detail: 화면은 값을 문자열로 받게 되어 있는데 서버는 숫자를 보내 어긋나는 곳이 있었습니다. 팀과 합의한 대로 서버 응답을 모두 문자열로 맞추고, 테스트로 고정했습니다.
    result: 운영 서버가 준비되기 전에도 화면이 실제 서버 응답으로 연동을 이어 갈 수 있었습니다. 운영 인프라는 미리 써 둔 구축 절차서(GPU 서버 한 대, k3s, RDS, S3)를 바탕으로 팀원이 세웠습니다. 절차서에는 이 구성을 고른 이유도 적었습니다. 검색할 때마다 임베딩 모델이 돌아 서버와 모델을 GPU 서버 한 대에 모으고, 프로젝트 예산 400달러 안에서 관리 비용이 따로 드는 EKS 대신 k3s를, 자동 백업 때문에 RDS를 고르는 설계였습니다. 실제로는 계정의 GPU 할당량이 0이어서 팀이 CPU 서버로 운영하기로 바꿨습니다.
    evidence:
      - { label: AWS 운영 인프라 구축 절차서 (infra-runbook.md), url: "https://github.com/SeongYuna/call.solidbob.cloud/blob/main/docs/infra-runbook.md" }

retro:
  metrics:
    - { value: "0건", label: 놓친 개인정보, note: "골든셋 마스킹 문항 36개(패턴 40개), 팀원 측정" }
    - { value: "0.971", label: 검색 정확도(Recall@5), note: "키워드 검색만 쓸 때는 0.853, 팀원 측정" }
    - { value: "1,472개", label: 서버 자동 테스트, note: "2026년 10월 6일 팀 전체 기록" }
    - { value: "116개", label: 내 커밋, note: "2026년 8월 26일부터 10월 6일까지" }
  learned:
    - 결과를 저장하지 않은 측정은 없는 것과 같았습니다. 이후 REMAKE DAY에서는 실측값을 파일에 계속 쌓았고, 이 포트폴리오도 평가 결과를 파일로 남깁니다.
    - 개인정보처럼 되돌릴 수 없는 실수는 넓게 막되, 얼마나 넓게 막는지도 따로 측정해야 한다는 것을 배웠습니다. 놓친 것과 과하게 마스킹한 것을 함께 측정하는 골든셋 문항을 두었습니다.
    - 실패를 처리하는 방식은 기능의 목적에 따라 달라야 합니다. 화면에 보여 주는 기능은 버티고, 저장이 목적인 기능은 실패를 숨기지 않게 나눴습니다.
  regrets:
    - 검색 결과의 순서를 다시 매기는 모델(리랭커)은 정확도를 올렸지만 CPU에서 9배 느려 운영에서 뺐습니다. GPU를 쓸 수 있으면 다시 넣어 보겠습니다.
    - 골든셋 문항 대부분은 팀이 직접 썼습니다. 다음에는 실제 통화 표본으로 다시 확인하겠습니다.
    - 규칙 기반 마스킹은 음성 인식 오류가 많아지면 놓치는 것이 생깁니다. 그래서 저장하는 자막은 마스킹한 뒤 한 번 더 암호화하게 했습니다(배포 전). NER 모델로 찾는 방식과도 같은 평가 도구로 비교해 볼 차례입니다.

