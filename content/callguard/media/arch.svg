<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9aa1ad"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="56" fill="#fff" font-size="28" font-weight="700">CallGuard 전체 구조</text>
  <text x="40" y="88" fill="#9aa1ad" font-size="17">통화 음성이 상담원 화면의 추천 카드가 되기까지</text>

  <!-- 왼쪽: 통화 입력 -->
  <g font-size="18" text-anchor="middle">
    <rect x="40" y="150" width="170" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="125" y="182" fill="#fff" font-weight="700">고객 통화</text>
    <text x="125" y="206" fill="#9aa1ad" font-size="14">음성</text>
    <rect x="40" y="270" width="170" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="125" y="302" fill="#fff" font-weight="700">Google STT</text>
    <text x="125" y="326" fill="#9aa1ad" font-size="14">음성을 자막으로</text>
    <rect x="40" y="390" width="170" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="125" y="422" fill="#fff" font-weight="700">통화 게이트웨이</text>
    <text x="125" y="446" fill="#9aa1ad" font-size="14">WebSocket</text>
  </g>
  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)">
    <line x1="125" y1="220" x2="125" y2="266"/>
    <line x1="125" y1="340" x2="125" y2="386"/>
    <line x1="210" y1="425" x2="286" y2="425"/>
  </g>

  <!-- 가운데: 서버 -->
  <rect x="290" y="130" width="620" height="440" rx="20" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="162" fill="#22c55e" font-size="18" font-weight="700">서버 (FastAPI)</text>
  <text x="890" y="162" fill="#9aa1ad" font-size="14" text-anchor="end">server와 ai는 자동 검사로 서로 분리</text>

  <rect x="310" y="390" width="180" height="70" rx="14" fill="#22c55e"/>
  <text x="400" y="422" fill="#0b1a10" font-size="19" font-weight="700" text-anchor="middle">① 개인정보 가림</text>
  <text x="400" y="446" fill="#0b1a10" font-size="14" text-anchor="middle">가장 먼저</text>

  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M490 425 C 540 425, 540 240, 586 240"/>
    <line x1="490" y1="425" x2="586" y2="425"/>
    <path d="M490 425 C 540 425, 540 520, 586 520"/>
  </g>

  <g font-size="17" text-anchor="middle">
    <rect x="590" y="200" width="300" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="740" y="232" fill="#fff" font-weight="700">② 문서 검색 (문장이 끝났을 때만)</text>
    <text x="740" y="258" fill="#9aa1ad" font-size="14">Elasticsearch + nori, KoE5 임베딩</text>
    <rect x="590" y="390" width="300" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="740" y="422" fill="#fff" font-weight="700">③ 상담 발언 점검</text>
    <text x="740" y="446" fill="#9aa1ad" font-size="14">약속하면 안 되는 표현, 빠진 안내</text>
    <rect x="590" y="485" width="300" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="740" y="517" fill="#fff" font-weight="700">④ 기록 저장</text>
    <text x="740" y="541" fill="#9aa1ad" font-size="14">PostgreSQL (가려진 자막만)</text>
  </g>

  <!-- 오른쪽: 상담원 화면 -->
  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M890 240 C 940 240, 940 330, 976 330"/>
    <path d="M890 425 C 940 425, 940 350, 976 350"/>
  </g>
  <rect x="980" y="280" width="190" height="120" rx="16" fill="#0f1115" stroke="#22c55e" stroke-width="2"/>
  <text x="1075" y="322" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">상담원 화면</text>
  <text x="1075" y="348" fill="#9aa1ad" font-size="14" text-anchor="middle">React</text>
  <text x="1075" y="374" fill="#9aa1ad" font-size="14" text-anchor="middle">추천 카드, 경고, 자막</text>

  <text x="600" y="630" fill="#9aa1ad" font-size="16" text-anchor="middle">배포: k3s (AWS), 서버와 검색 코드는 한 컨테이너, 코드 의존은 자동 검사로 한 방향만 허용</text>
</svg>
