<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">"측정 불가" 를 숫자로 바꾼 평가 하네스</text>
  <g font-size="21" font-weight="700" text-anchor="middle">
    <rect x="40" y="150" width="250" height="130" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="165" y="205" fill="#fff">골든셋</text><text x="165" y="240" fill="#9aa1ad" font-size="16" font-weight="400">질문 → 정답 문서 채점표</text>
    <rect x="340" y="150" width="250" height="130" rx="18" fill="#0f1115" stroke="#22c55e" stroke-width="2"/>
    <text x="465" y="205" fill="#fff">하네스</text><text x="465" y="240" fill="#9aa1ad" font-size="16" font-weight="400">검색 · 마스킹 · 판정</text>
    <rect x="640" y="150" width="250" height="130" rx="18" fill="#0f1115" stroke="#22c55e" stroke-width="2"/>
    <text x="765" y="205" fill="#fff">--record</text><text x="765" y="240" fill="#9aa1ad" font-size="16" font-weight="400">3회 중 최저치만 기록</text>
    <rect x="940" y="150" width="220" height="130" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="1050" y="205" fill="#fff">DB</text><text x="1050" y="240" fill="#9aa1ad" font-size="16" font-weight="400">eval_run · eval_result</text>
  </g>
  <g fill="#22c55e" font-size="36" text-anchor="middle"><text x="315" y="225">→</text><text x="615" y="225">→</text><text x="915" y="225">→</text></g>
  <rect x="40" y="330" width="1120" height="120" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="80" y="375" fill="#fff" font-size="21" font-weight="700">NaN · 미구현은 기록하지 않는다</text>
  <text x="80" y="412" fill="#9aa1ad" font-size="18">run_id 마다 커밋 · 표본 수가 남아, 어느 수치든 다시 재현할 수 있다</text>
  <g font-size="44" font-weight="700" fill="#22c55e" text-anchor="middle"><text x="300" y="545">0.971</text><text x="900" y="545">0건</text></g>
  <g font-size="18" fill="#9aa1ad" text-anchor="middle"><text x="300" y="585">운영 검색 Recall@5</text><text x="900" y="585">운영 개인정보 누락 (n=40)</text></g>
</svg>
