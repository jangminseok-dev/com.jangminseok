  regrets:
    - 아직 운영 배포 전입니다 — 개발 compose에서는 인증 분리가 import 규율로만 지켜집니다
    - pgvector 이미지를 미리 골랐지만 AI 기능(초안 해석)은 아직 규칙 기반 자리만 있습니다
    - 검색과 업로드 지연을 측정하지 않았습니다 — 운영 전에 수치를 남겨야 합니다
