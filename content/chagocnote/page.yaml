# 프로젝트 소개 페이지 v2: 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 반려동물 미용 매장이 예약, 고객, 미용 기록을 한 앱에서 관리하는 서비스입니다. 보호자는 앱을 설치하지 않고 링크 하나로 미용 알림장을 받아 봅니다.
  role: 혼자서 설계, 서버, 매장용 앱, 보호자용 웹을 모두 만들었습니다.
  why: 예약부터 미용 기록, 보호자 안내까지 한 흐름으로 잇는 것이 목표입니다. 여러 매장이 한 서버를 함께 쓰기 때문에 다른 매장의 고객 정보가 보이지 않게 막는 데 가장 공을 들였습니다.
  highlights:
    - { value: "1,294개", label: 서버 자동 테스트, note: "단위 테스트 기준, 통합 405개 별도, 알림장 기능 완료 시점" }
    - { value: "6종", label: import-linter 계약 }
    - { value: "11개", label: 보호자 웹 브라우저 테스트, note: "모두 통과, 개발 서버와 chromium 기준" }

features:
  - title: 카카오톡 글로 예약 초안 만들기
    body: 보호자가 보낸 카카오톡 글을 붙여 넣거나 공유하면 날짜, 시각, 보호자, 메뉴를 추정해 예약 칸을 미리 채웁니다. 추정한 칸에는 표시가 붙고, 사장님이 확인한 뒤에야 저장됩니다. 지금은 정해 둔 규칙으로 글을 읽습니다.
    core: true
    image: media/poster.webp
  - title: 미용 사진과 영상 기록
    body: 미용 전후 사진과 영상을 방문 기록에 붙입니다. 앱이 사진을 세 가지 크기로 줄이고 촬영 위치 정보를 지운 뒤 올립니다. 올리다가 인터넷이 끊겨도 남은 단계부터 이어서 올립니다.
    core: true
    image: media/05-1.webp
  - title: 검색창 하나로 고객 찾기
    body: 전화번호 뒷자리, 보호자 이름, 반려동물 이름, 초성을 같은 검색창에 입력합니다. 4자리 이하 숫자를 넣으면 전화번호 뒷자리로 찾고, "ㄱㅁㅈ"처럼 초성만 넣으면 초성으로 찾습니다.
    image: media/06-1.webp
  - title: 예약 달력과 다음 예약 잡기
    body: 한 달 달력에서 날짜마다 예약 수를 보고, 하루 일정을 시간순으로 확인합니다. 미용을 마칠 때 그 반려동물의 지난 방문 간격을 바탕으로 다음 예약 날짜를 미리 채워 줍니다.
    image: media/f-calendar.webp
  - title: 말로 메모 받아쓰기
    body: 미용 기록의 메모 칸은 손으로 치지 않고 말로 입력할 수 있습니다. 말하는 동안에는 회색 글로 보이고, 한 구절이 끝나면 확정됩니다. 10초 동안 말이 없으면 받아쓰기를 멈춥니다.
    image: media/f-dictation.webp
  - title: 보호자 미용 알림장
    body: 보호자는 매장이 만든 링크를 열어 그날의 미용 사진, 영상, 케어 메모를 봅니다. 앱 설치나 로그인은 필요 없습니다. 금액과 몸무게를 보여 줄지는 매장이 정하고, 매장 내부 메모는 보이지 않습니다. 매장은 링크를 언제든 끊을 수 있습니다.
    image: media/f-report.webp
featureNote: 화면은 모두 개발 환경에서 찍었습니다. 알림장은 서버, 보호자 웹, 매장 앱의 보내기 화면까지 만들었습니다.

architecture:
  image: media/arch.svg
  summary: 사장님은 매장 앱을 쓰고, 보호자는 링크로 웹 알림장을 엽니다. 두 쪽의 요청은 모두 게이트웨이를 거쳐 로그인 서버나 API 서버로 갑니다. 사진과 영상은 서버를 거치지 않고 오브젝트 스토리지로 바로 올라갑니다.
  points:
    - title: 매장 요청은 매번 소속부터 다시 확인
      body: 여러 매장이 한 데이터베이스를 함께 씁니다. 그래서 매장 데이터를 다루는 요청은 매번 이 사람이 그 매장 소속인지 데이터베이스에서 다시 읽습니다. 직원을 내보내면 바로 다음 요청부터 막히게 하려는 선택입니다. 이 확인이 빠진 API 주소(엔드포인트)가 생기면 자동 테스트가 실패합니다.
    - title: 사진과 영상은 오브젝트 스토리지에 직접 올립니다
      body: 사진은 긴 변이 3000픽셀이고 영상은 최대 200MB입니다. 이런 파일이 서버를 거치면 서버의 메모리와 연결을 오래 붙잡습니다. 서버는 15분 동안 유효한 업로드 전용 임시 주소(presigned URL)를 발급하고, 앱이 그 주소로 오브젝트 스토리지에 직접 올립니다.
    - title: 로그인은 별도 서버로 나눴습니다
      body: 로그인 토큰(JWT)에 서명하는 키는 로그인 서버만 가집니다. 나머지 기능을 맡은 API 서버는 토큰을 확인만 합니다. 앞단의 게이트웨이가 주소에 따라 두 서버로 요청을 나눕니다.
    - title: 모듈 경계를 나누고 import-linter로 검사
      body: 서버는 매장, 고객, 방문 기록, 미디어 같은 기능 모듈로 나눴습니다. 모듈끼리는 서로의 코드를 직접 가져다 쓰지 않고, 가운데 둔 허브에 정해 둔 약속(포트)만 봅니다. 이 규칙 6가지는 import-linter가 확인합니다.
  layers:
    - { name: 매장 앱, items: [Flutter, "iOS, Android"] }
    - { name: 보호자 웹, items: [Next.js 16, TypeScript] }
    - { name: 서버, items: [Python 3.13, FastAPI, SQLAlchemy 2 + Alembic, import-linter] }
    - { name: 데이터, items: [PostgreSQL, Redis, MinIO (S3 호환)] }
    - { name: 개발 환경과 배포, items: [Docker Compose, Caddy, GitHub Actions, Vercel 예정] }

role:
  summary: 1인 프로젝트입니다. 서비스 설계부터 서버, 매장 앱, 보호자 웹, 개발 환경까지 혼자 맡았습니다.
  mine:
    - 서비스 설계와 단계별 설계 문서, 구현 계획
    - 서버 구조와 모듈 경계를 강제하는 import-linter 계약 6종
    - 매장별 데이터 격리와 로그인 서버 분리
    - 고객과 반려동물, 예약과 방문, 미용 기록 API
    - 사진과 영상 직접 업로드, 끊겨도 이어서 올리는 업로드 대기열
    - 알림장 링크 설계와 보호자 웹
    - Flutter 매장 앱 전체와 Docker Compose 개발 환경
  team: []
  collab:
    - 작업을 기반, 고객과 반려동물, 방문과 예약, 기록과 미디어, 알림장의 다섯 단계로 나눴습니다. 단계마다 설계 문서를 먼저 쓰고 구현 계획을 이어서 썼습니다.
    - 설계와 다르게 간 것, 일부러 막지 않은 동작, 미룬 일은 단계마다 결정 기록으로 남겼습니다. 저장소에 남은 결정 기록은 8개입니다.
  ai:
    - AI 코딩 도구와 함께 개발했습니다. AI에게 맡기기 전에 설계 문서와 작업 단위로 쪼갠 구현 계획을 먼저 썼습니다.
    - 네 번째 계획인 매장 앱부터는 계획의 코드를 참조용 구현에서 먼저 돌렸습니다. 테스트가 통과하는지 보고, 코드를 일부러 망가뜨렸을 때 테스트가 실패하는지도 확인한 뒤에 본 코드로 옮겼습니다.
    - 모듈 경계는 import-linter 규칙 6종이, 서버 기능은 단위 테스트 1,294개와 통합 테스트 405개가, 보호자 웹은 브라우저 테스트 11개가, 매장 앱은 테스트 861개가 확인합니다.
    - Git에 올릴 때마다 CI가 바뀐 쪽의 검사를 자동으로 돌립니다. 서버는 실제 Postgres에 붙는 통합 테스트까지 돌리고, 보호자 웹의 브라우저 테스트는 개발 서버가 필요해 로컬에서만 돌립니다.

troubles:
  - title: 다른 매장의 고객 정보가 보이지 않게 막기
    problem: 매장 데이터를 다루는 기능이 늘수록 권한 확인을 한 곳이라도 빠뜨릴 위험이 커졌습니다. 한 번만 빠져도 다른 매장의 고객 정보가 보입니다.
    cause: 운영자 기능의 권한 확인은 각 기능의 첫 줄에 있어서, 그 줄을 빠뜨리면 그대로 열렸습니다. 확인이 필요한 엔드포인트도 손으로 목록을 관리해서, 새 엔드포인트를 목록에 넣지 않아도 테스트가 통과했습니다.
    solution: 권한 확인을 각 기능 안이 아니라 요청이 들어오는 입구(라우터)로 옮겼습니다. 매장 데이터는 라우터에서 소속과 권한을 확인한 결과를 받아야만 다룰 수 있습니다. 손으로 관리하던 목록은 버렸습니다. 대신 서버에 등록된 모든 엔드포인트를 자동으로 훑어 확인이 빠진 엔드포인트를 찾는 테스트를 만들었습니다.
    detail: 최종 검토에서는 사장이 한 명도 없는 매장이 생길 수 있는 문제도 찾았습니다. 두 요청이 동시에 역할을 바꾸면 이미 바뀐 값을 모른 채 판단했기 때문입니다. 역할을 바꾸는 모든 기능이 먼저 그 매장 행에 잠금을 걸도록 고쳐서, 한 매장의 변경은 한 번에 하나씩 처리됩니다.
    result: 새 엔드포인트에서 권한 확인을 빠뜨리면 사람이 목록을 고치지 않아도 테스트가 실패합니다.
  - title: 로그인 없이 여는 알림장 링크를 안전하게 만들기
    problem: 보호자는 앱을 설치하지 않으니 로그인 없이 링크만으로 미용 기록을 보여 줘야 했습니다. 링크를 추측해서 열거나, 데이터베이스가 유출되었을 때 링크를 만들어 내는 일은 막아야 했습니다.
    solution: 링크 주소는 무작위 ID와 서버만 아는 키로 만든 서명(HMAC)을 합친 43글자입니다. 데이터베이스에는 ID만 저장하고 서명은 요청 때마다 다시 계산합니다. 서명이 맞지 않는 요청은 데이터베이스를 읽기 전에 돌려보냅니다. 링크 값이 접근 로그에 남지 않도록 주소가 아닌 요청 헤더로만 받습니다.
    detail: 처음 계획은 IP 하나에서 10분 동안 20번 실패하면 그 IP의 모든 요청을 막는 것이었습니다. 검토 중에 같은 공인 IP를 쓰는 보호자 전체가 익명 요청 20번으로 막힐 수 있다는 점을 찾았습니다. 그래서 서명이 틀린 요청에만 횟수 제한을 걸도록 고쳤습니다.
    result: 데이터베이스만 가지고는 링크를 만들 수 없습니다. 보호자에게 보내는 항목은 하나씩 지정해서 내부 메모가 섞이지 않습니다. 링크를 끊은 뒤에도 남는 위험 다섯 가지는 감수할 항목으로 결정 기록에 적어 두었습니다.
  - title: 큰 사진과 영상을 끊기지 않게 올리기
    problem: 긴 변 3000픽셀 사진과 최대 200MB 영상을 올려야 했습니다. 올리는 도중에 앱이 꺼지거나 인터넷이 끊길 수도 있습니다.
    solution: 서버는 15분 동안 유효한 presigned URL만 발급하고, 앱이 오브젝트 스토리지에 직접 올립니다. 올릴 파일과 진행 단계는 기기에 저장한 대기열에 적어 둡니다. 앱을 다시 켜면 남은 단계부터 이어 가고, presigned URL이 만료됐으면 발급부터 다시 합니다.
    detail: 짧은 영상에서는 압축 진행률이 화면에 한 번도 표시되지 않았습니다. 진행률을 0.2초마다 읽었는데, 시뮬레이터에서 짧은 표본 영상의 압축이 12~115ms 만에 끝났기 때문입니다. 압축의 시작과 끝에 진행률을 한 번씩 더 보내도록 고쳤습니다.
    result: 끊긴 업로드는 처음이 아니라 남은 단계부터 이어서 올라갑니다(실기기 압축 시간과 업로드 실패율은 측정 전).
  - title: 한 검색창에서 번호, 이름, 초성을 모두 찾기
    problem: 사장님은 한 검색창에 전화번호 뒷자리, 보호자 이름, 반려동물 이름, 초성을 입력합니다. 여러 테이블을 그때그때 합쳐서 계산하면 인덱스를 쓸 수 없어서 고객이 늘수록 느려집니다.
    solution: 이름, 초성, 번호를 고객마다 한 행에 모은 검색용 테이블을 따로 만들고, 그 테이블에 인덱스를 걸었습니다. 서버가 검색어를 먼저 분류합니다. 4자리 이하 숫자는 전화번호 뒷자리로, 초성만 있으면 초성으로, 나머지는 이름으로 찾습니다.
    detail: 처음 설계는 뒷자리 결과를 앞에 두고 다른 결과와 섞어 보여 주는 것이었습니다. 순위를 섞으면 다음 쪽을 이어서 불러오는 방식(커서 페이지네이션)과 충돌해서, 4자리 이하 숫자는 뒷자리로만 찾도록 좁혔습니다. 고객 정보가 바뀌면 같은 저장 작업 안에서 검색용 행도 다시 만듭니다.
    result: 검색창 하나로 전화번호 뒷자리, 이름, 초성을 모두 찾습니다(검색 속도는 측정 전).

retro:
  metrics:
    - { value: "1,294개", label: 서버 단위 테스트, note: 알림장 기능 완료 시점 }
    - { value: "405개", label: 서버 통합 테스트, note: 알림장 기능 완료 시점 }
    - { value: "861개", label: 매장 앱 테스트, note: 알림장 보내기 화면 병합 시점 }
    - { value: "125개", label: 보호자 웹 단위 테스트 }
    - { value: "6종", label: import-linter 계약 }
  learned:
    - AI가 코드를 빠르게 많이 쓸수록 사람이 먼저 경계를 정해야 했습니다. 설계 문서, 자동 검사, 테스트로 경계를 정해 두니 경계를 넘는 코드는 검사에서 걸렸습니다.
    - 사람이 손으로 관리하는 목록은 결국 빠뜨립니다. 확인이 필요한 엔드포인트를 자동으로 찾게 바꾼 뒤에야 빠짐없이 검사할 수 있었습니다.
    - 테스트가 통과하는 것만으로는 부족했습니다. 코드를 일부러 망가뜨렸을 때 테스트가 실패하는지까지 봐야 테스트를 믿을 수 있었습니다.
  regrets:
    - 아직 운영 배포 전입니다. 운영 환경에 올린 뒤 보호자 웹과 알림장 보내기를 실제 휴대폰과 카카오톡에서 확인하는 것이 다음 할 일입니다.
    - 검색 속도, 실기기 영상 압축 시간, 업로드 실패율은 아직 측정 전입니다. 운영 전에 측정해서 수치로 남기겠습니다.
    - 카카오톡 글 해석은 아직 정해 둔 규칙으로만 합니다. 규칙 대신 AI 모델을 끼울 자리는 만들어 두었으니 다음에 붙여 볼 차례입니다.

