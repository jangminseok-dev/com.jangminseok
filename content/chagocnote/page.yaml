# 프로젝트 소개 페이지 v2: 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 반려동물 미용 매장이 예약, 고객, 미용 기록, 매출을 한 앱에서 관리하는 서비스입니다. 보호자는 앱을 설치하지 않고 링크로 미용 알림장을 받고, 첫 방문 문진표와 미용 동의서도 링크로 냅니다.
  role: 혼자서 설계, 서버, 매장용 앱, 보호자용 웹을 모두 만들었습니다.
  why: 예약부터 미용 기록, 보호자 안내까지 한 흐름으로 잇는 것이 목표입니다. 여러 매장이 한 서버를 함께 쓰기 때문에 다른 매장의 고객 정보가 보이지 않게 막는 데 가장 공을 들였습니다.
  highlights:
    - { value: "2,858개", label: 서버 자동 테스트, note: "단위 테스트 기준, 통합 876개 별도, 2026-11-18 실행" }
    - { value: "26/30", label: 기록 검색 품질 확인, note: "정답이 위 5개 안에 든 질문 수, 목표 24개" }
    - { value: "6종", label: import-linter 계약 }

features:
  - title: 카카오톡 글로 예약 초안 만들기
    body: 보호자가 보낸 카카오톡 글을 붙여 넣거나 공유하면 날짜, 시각, 보호자, 메뉴를 추정해 예약 칸을 미리 채웁니다. 추정한 칸에는 표시가 붙고, 사장님이 확인한 뒤에야 저장됩니다. 지금은 정해 둔 규칙으로 글을 읽습니다.
    core: true
    image: media/poster.webp
  - title: 미용 사진과 영상 기록
    body: 미용 전후 사진과 영상을 방문 기록에 붙입니다. 앱이 사진을 세 가지 크기로 줄이고 촬영 위치 정보를 지운 뒤 올립니다. 올리다가 인터넷이 끊겨도 남은 단계부터 이어서 올립니다. 메모는 손으로 치지 않고 말로 받아쓸 수 있습니다.
    core: true
    image: media/05-1.webp
  - title: 미용 기록을 낱말과 뜻으로 찾기
    body: 케어 노트, 내부 메모, 지병 메모처럼 매장이 적어 둔 글을 검색창 하나로 찾습니다. 같은 낱말이 없어도 뜻이 비슷하면 찾습니다. 예를 들어 "드라이어 바람에 겁먹는 강아지"로 찾으면 "드라이기 소리를 무서워해요"라고 적어 둔 아이가 나옵니다. 고객은 전화번호 뒷자리, 이름, 초성으로 찾습니다.
    core: true
    image: media/f-search.webp
  - title: 알림톡 자동 발송
    body: 예약 접수, 전날 안내, 예약 변경과 취소, 알림장을 매장 카카오톡 채널 이름으로 보냅니다. 종류마다 켜고 끌 수 있습니다. 밤에 보낼 전날 안내는 아침으로 미룹니다. 보낸 내역은 방문 상세에서 봅니다. 받을 수 없는 번호면 다른 방법으로 다시 보냅니다.
    image: media/f-alimtalk.webp
  - title: 첫 방문 문진표와 미용 동의서
    body: 보호자는 매장이 보낸 링크를 열어 로그인 없이 문진표를 적고 동의서에 서명합니다. 동의서에서 글자를 치는 칸은 이름 하나뿐입니다. 손가락으로 서명하고 체크 하나를 누르면 보내집니다. 나이가 많거나 지병이 있는 아이의 동의서에는 그에 맞는 안내가 붙습니다.
    image: media/f-consent.webp
  - title: 보호자 미용 알림장과 기록 모아 보기
    body: 보호자는 매장이 만든 링크를 열어 그날의 미용 사진, 영상, 케어 메모를 봅니다. 앱 설치나 로그인은 필요 없습니다. 매장 내부 메모는 보이지 않습니다. 알림장에서 계정을 이으면 지난 알림장, 사진, 몸무게 변화를 한곳에서 보고 가족도 초대할 수 있습니다.
    image: media/f-report.webp
  - title: 매출과 다시 올 때가 된 아이
    body: 사장님은 일, 주, 월, 연 단위 매출과 이번 달 목표를 얼마나 채웠는지 봅니다. 결제 수단별, 메뉴별 매출과 금액을 적지 않은 방문도 따로 보여 줍니다. 아이마다 최근 방문 간격으로 미용 주기를 계산해 다시 올 때가 된 아이를 알려 줍니다.
    image: media/f-sales.webp
  - title: 예약 달력과 하루 마무리
    body: 한 달 달력에서 날짜마다 예약 수와 남은 일을 보고, 하루 일정을 시간순으로 확인합니다. 첫 방문, 지병, 동의서 없음처럼 확인할 것은 예약에 자동으로 붙습니다. 하루를 마칠 때는 결제를 적지 않은 방문과 알림장을 보내지 않은 방문을 차례로 넘기며 정리합니다.
    image: media/f-wrapup.webp
featureNote: 화면은 앱 화면 테스트의 비교 이미지와 개발 환경에서 찍었습니다. 이름과 금액은 지어낸 값입니다. 알림톡은 개발 환경의 가짜 발송으로만 확인했습니다. 보호자 웹의 로그인은 아직 개발용만 있습니다.

architecture:
  image: media/arch.svg
  summary: 사장님은 매장 앱을 쓰고, 보호자는 링크로 웹 알림장과 서류를 엽니다. 두 쪽의 요청은 모두 게이트웨이를 거쳐 로그인 서버나 API 서버로 갑니다. 사진과 영상은 서버를 거치지 않고 오브젝트 스토리지로 바로 올라갑니다. 기록 검색에 쓰는 임베딩은 서버 옆의 별도 프로세스가 만듭니다.
  points:
    - title: 매장 요청은 매번 소속부터 다시 확인
      body: 여러 매장이 한 데이터베이스를 함께 씁니다. 그래서 매장 데이터를 다루는 요청은 매번 이 사람이 그 매장 소속인지 데이터베이스에서 다시 읽습니다. 직원을 내보내면 바로 다음 요청부터 막히게 하려는 선택입니다. 이 확인이 빠진 API 주소(엔드포인트)가 생기면 자동 테스트가 실패합니다.
    - title: 기록 검색의 임베딩은 우리 서버 안에서 만듭니다
      body: 기록 검색에는 공개된 다국어 임베딩 모델(multilingual-e5-small)을 씁니다. 외부 AI API를 부르지 않고 서버 옆의 별도 프로세스에서 실행합니다. 그래서 호출 요금이 없고 매장 기록이 밖으로 나가지 않습니다. 이 프로세스가 멈춰도 낱말 검색은 그대로 답합니다. 뜻 검색에 쓸 값은 나중에 채웁니다.
    - title: 사진과 영상은 오브젝트 스토리지에 직접 올립니다
      body: 사진은 긴 변이 3000픽셀이고 영상은 최대 200MB입니다. 이런 파일이 서버를 거치면 서버의 메모리와 연결을 오래 붙잡습니다. 서버는 15분 동안 유효한 업로드 전용 임시 주소(presigned URL)를 발급하고, 앱이 그 주소로 오브젝트 스토리지에 직접 올립니다.
    - title: 로그인은 별도 서버로 나눴습니다
      body: 로그인 토큰(JWT)에 서명하는 키는 로그인 서버만 가집니다. 나머지 기능을 맡은 API 서버는 토큰을 확인만 합니다. 앞단의 게이트웨이가 주소에 따라 두 서버로 요청을 나눕니다.
    - title: 모듈 경계를 나누고 import-linter로 검사
      body: 서버는 매장, 고객, 방문 기록, 미디어, 알림톡, 검색 같은 기능 모듈로 나눴습니다. 모듈끼리는 서로의 코드를 직접 가져다 쓰지 않고, 가운데 둔 허브에 정해 둔 약속(포트)만 봅니다. 이 규칙 6가지는 import-linter가 확인합니다.
  layers:
    - { name: 매장 앱, items: [Flutter, "iOS, Android"] }
    - { name: 보호자 웹, items: [Next.js 16, TypeScript] }
    - { name: 서버, items: [Python 3.13, FastAPI, SQLAlchemy 2 + Alembic, import-linter] }
    - { name: 기록 검색, items: [multilingual-e5-small, ONNX Runtime, pgvector] }
    - { name: 데이터, items: [PostgreSQL, Redis, MinIO (S3 호환)] }
    - { name: 개발 환경과 배포, items: [Docker Compose, Caddy, GitHub Actions, Vercel 예정] }

role:
  summary: 1인 프로젝트입니다. 서비스 설계부터 서버, 매장 앱, 보호자 웹, 개발 환경까지 혼자 맡았습니다.
  mine:
    - 서비스 설계와 기능 묶음별 설계 문서, 구현 계획
    - 서버 구조와 모듈 경계를 강제하는 import-linter 계약 6종
    - 매장별 데이터 격리와 로그인 서버 분리
    - 고객과 반려동물, 예약과 방문, 미용 기록 API
    - 사진과 영상 직접 업로드, 끊겨도 이어서 올리는 업로드 대기열
    - 알림장 링크 설계와 보호자 웹
    - 알림톡 발송 대기열과 발송 내역
    - 기록 검색의 임베딩 프로세스와 품질 확인 스크립트
    - 문진표와 전자 동의서, 보호자 계정 연결
    - 매출 집계와 미용 주기 계산
    - Flutter 매장 앱 전체와 Docker Compose 개발 환경
  team: []
  collab:
    - 작업을 기능 묶음으로 나눴습니다. 묶음마다 설계 문서를 먼저 쓰고 구현 계획을 이어서 썼습니다. 지금까지 설계 문서는 21개, 구현 계획은 48개입니다.
    - 설계와 다르게 간 것, 일부러 막지 않은 동작, 미룬 일은 묶음마다 결정 기록으로 남겼습니다. 저장소에 남은 결정 기록은 17개입니다.
  ai:
    - AI 코딩 도구와 함께 개발했습니다. AI에게 맡기기 전에 설계 문서와 작업 단위로 쪼갠 구현 계획을 먼저 썼습니다.
    - 네 번째 계획인 매장 앱부터는 계획의 코드를 참조용 구현에서 먼저 돌렸습니다. 테스트가 통과하는지 보고, 코드를 일부러 망가뜨렸을 때 테스트가 실패하는지도 확인한 뒤에 본 코드로 옮겼습니다.
    - 모듈 경계는 import-linter 규칙 6종이 확인합니다. 서버에는 단위 테스트 2,858개와 통합 테스트 876개가 있습니다. 매장 앱에는 테스트 1,522개가 있습니다. 보호자 웹에는 단위 테스트 556개와 브라우저 테스트 51개가 있습니다.
    - 기록 검색의 품질은 지어낸 미용 기록과 질문으로 만든 스크립트로 확인합니다. 기준값을 바꿀 때마다 이 스크립트로 결과를 비교했습니다.
    - Git에 올릴 때마다 CI가 서버, 보호자 웹, 매장 앱 가운데 바뀐 쪽의 검사를 자동으로 실행합니다. 서버는 실제 Postgres에 붙는 통합 테스트까지 돌립니다. 보호자 웹의 브라우저 테스트와 임베딩 프로세스를 쓰는 검사는 개발 서버가 필요해서 로컬에서만 돌립니다.

troubles:
  - title: "권한 확인을 요청 입구로 옮겨, 빠뜨리면 테스트가 먼저 실패하게 했습니다"
    problem: 매장 데이터를 다루는 기능이 늘수록 권한 확인을 한 곳이라도 빠뜨릴 위험이 커졌습니다. 한 번만 빠져도 다른 매장의 고객 정보가 보입니다.
    cause: 운영자 기능의 권한 확인은 각 기능의 첫 줄에 있어서, 그 줄을 빠뜨리면 그대로 열렸습니다. 확인이 필요한 엔드포인트도 손으로 목록을 관리해서, 새 엔드포인트를 목록에 넣지 않아도 테스트가 통과했습니다.
    solution: 권한 확인을 각 기능 안이 아니라 요청이 들어오는 입구(라우터)로 옮겼습니다. 매장 데이터는 라우터에서 소속과 권한을 확인한 결과를 받아야만 다룰 수 있습니다. 손으로 관리하던 목록은 버렸습니다. 대신 서버에 등록된 모든 엔드포인트를 자동으로 훑어 확인이 빠진 엔드포인트를 찾는 테스트를 만들었습니다.
    detail: 최종 검토에서는 사장이 한 명도 없는 매장이 생길 수 있는 문제도 찾았습니다. 두 요청이 동시에 역할을 바꾸면 이미 바뀐 값을 모른 채 판단했기 때문입니다. 역할을 바꾸는 모든 기능이 먼저 그 매장 행에 잠금을 걸도록 고쳐서, 한 매장의 변경은 한 번에 하나씩 처리됩니다.
    result: 새 엔드포인트에서 권한 확인을 빠뜨리면 사람이 목록을 고치지 않아도 테스트가 실패합니다.
  - title: "뜻 검색의 기준값을, 맞는 글이 여럿인 질문까지 넣어 다시 정했습니다"
    figure: { value: "13/18", label: 맞는 글이 여럿인 질문에서 찾은 정답 }
    problem: 기록 검색은 같은 낱말이 없어도 뜻이 비슷한 글을 찾아야 했습니다. 동시에 관계없는 글이 줄줄이 딸려 나오면 안 됐습니다.
    cause: 측정해 보니 이 모델은 관계없는 글에도 유사도를 0.79에서 0.82까지 주고, 맞는 글에는 0.83에서 0.89를 줬습니다. 처음 설계한 "유사도 0.80 이상"만으로는 문장으로 찾을 때 기록 60개 가운데 50개 넘게 딸려 나왔습니다.
    solution: 고정 기준 대신 가장 가까운 글과의 차이로 자르게 바꿨습니다. 처음에는 1등에서 0.02 안쪽, 최대 5개로 좁혔습니다. 최종 검토에서 맞는 글이 여럿인 질문 8개를 더해 보니 정답 18개 가운데 9개만 찾았습니다. 그래서 1등에서 0.04 안쪽, 최대 10개로 넓혔습니다.
    detail: 품질은 지어낸 미용 기록 60개와 질문으로 확인합니다. 정답이 하나인 질문 30개는 정답이 위 5개 안에 드는지 셉니다. 이 질문들은 기준값을 좁혀도 넓혀도 26개로 같았습니다. 그래서 좁힐 때 생기는 손실을 보여 주지 못했습니다. 넓힌 뒤에는 문장으로 찾을 때 평균 10줄쯤 나옵니다. 놓치는 글과 딸려 나오는 글 사이에서 고른 값입니다.
    result: 정답이 하나인 질문은 30개 가운데 26개(목표 24개), 맞는 글이 여럿인 질문은 정답 18개 가운데 13개를 찾습니다. 외부 AI API를 부르지 않아 호출 요금이 없습니다.
  - title: "로그인 없이 여는 알림장 링크를, 데이터베이스만으로는 만들 수 없게 했습니다"
    problem: 보호자는 앱을 설치하지 않으니 로그인 없이 링크만으로 미용 기록을 보여 줘야 했습니다. 링크를 추측해서 열거나, 데이터베이스가 유출되었을 때 링크를 만들어 내는 일은 막아야 했습니다.
    solution: 링크 주소는 무작위 ID와 서버만 아는 키로 만든 서명(HMAC)을 합친 43글자입니다. 데이터베이스에는 ID만 저장하고 서명은 요청 때마다 다시 계산합니다. 서명이 맞지 않는 요청은 데이터베이스를 읽기 전에 돌려보냅니다. 링크 값이 접근 로그에 남지 않도록 주소가 아닌 요청 헤더로만 받습니다.
    detail: 처음 계획은 IP 하나에서 10분 동안 20번 실패하면 그 IP의 모든 요청을 막는 것이었습니다. 검토 중에 같은 공인 IP를 쓰는 보호자 전체가 익명 요청 20번으로 막힐 수 있다는 점을 찾았습니다. 그래서 서명이 틀린 요청에만 횟수 제한을 걸도록 고쳤습니다. 문진표와 동의서 링크도 같은 방식으로 만들되, 알림장 링크와 서로 바꿔 쓸 수 없게 했습니다.
    result: 데이터베이스만 가지고는 링크를 만들 수 없습니다. 보호자에게 보내는 항목은 하나씩 지정해서 내부 메모가 섞이지 않습니다. 링크를 끊은 뒤에도 남는 위험 다섯 가지는 감수할 항목으로 결정 기록에 적어 두었습니다.
  - title: "가짜 발송에서는 보이지 않던 알림톡 주기 결함을 최종 검토에서 고쳤습니다"
    figure: { value: "2.5초", label: 10분마다 돌아야 할 작업이 실제로 돈 간격, before: true }
    problem: 알림톡은 데이터베이스의 발송 대기 표에 쌓아 두고, API 서버 안의 발송 루프가 꺼내 보냅니다. 이 루프는 문안 심사 상태와 잔액을 10분마다, 24시간마다 업체에 묻는 일도 함께 맡습니다.
    cause: 루프가 한 바퀴 돌 때마다 발송 담당 객체를 새로 만들어서 주기 작업의 마지막 시각도 매번 처음부터 시작했습니다. 그래서 10분과 24시간짜리 작업이 루프 간격인 2.5초마다 실행됐습니다. 개발 환경의 가짜 발송 업체에서는 증상이 드러나지 않았습니다.
    solution: 주기 작업의 시각을 프로세스에 하나만 두도록 고쳤습니다. 같은 검토에서 한 줄의 결과 저장이 실패하면 대기열 전체가 멈출 수 있는 문제도 찾았습니다. 그 줄만 실패로 적고 넘어가게 했습니다.
    result: 주기 작업이 정해진 간격대로 실행됩니다. 실제 업체 계정으로는 아직 보내 보지 않았습니다. 운영 전에 확인할 일로 남겼습니다.
  - title: "올리다 끊긴 사진과 영상이 남은 단계부터 이어서 올라가게 했습니다"
    problem: 긴 변 3000픽셀 사진과 최대 200MB 영상을 올려야 했습니다. 올리는 도중에 앱이 꺼지거나 인터넷이 끊길 수도 있습니다.
    solution: 올릴 파일과 진행 단계는 기기에 저장한 대기열에 적어 둡니다. 앱을 다시 켜면 남은 단계부터 이어 가고, presigned URL이 만료됐으면 발급부터 다시 합니다.
    detail: 짧은 영상에서는 압축 진행률이 화면에 한 번도 표시되지 않았습니다. 진행률을 0.2초마다 읽었는데, 시뮬레이터에서 짧은 표본 영상의 압축이 12~115ms 만에 끝났기 때문입니다. 압축의 시작과 끝에 진행률을 한 번씩 더 보내도록 고쳤습니다.
    result: 끊긴 업로드는 처음이 아니라 남은 단계부터 이어서 올라갑니다.

retro:
  metrics:
    - { value: "876개", label: 서버 통합 테스트, note: "2026-11-18 실행, 모두 통과" }
    - { value: "1,522개", label: 매장 앱 테스트, note: "2026-11-18 실행, 모두 통과" }
    - { value: "51개", label: 보호자 웹 브라우저 테스트, note: "2026-11-18 실행, 단위 테스트 556개 별도" }
  learned:
    - AI가 코드를 빠르게 많이 쓸수록 사람이 먼저 경계를 정해야 했습니다. 설계 문서, 자동 검사, 테스트로 경계를 정해 두니 경계를 넘는 코드는 검사에서 걸렸습니다.
    - 사람이 손으로 관리하는 목록은 결국 빠뜨립니다. 확인이 필요한 엔드포인트를 자동으로 찾게 바꾼 뒤에야 빠짐없이 검사할 수 있었습니다.
    - 테스트가 통과하는 것만으로는 부족했습니다. 코드를 일부러 망가뜨렸을 때 테스트가 실패하는지까지 봐야 테스트를 믿을 수 있었습니다.
    - 정답이 하나인 질문만으로는 검색 기준을 좁혀서 생긴 손실이 보이지 않았습니다. 무엇을 놓치는지 보려면 그 손실이 드러나는 질문을 따로 만들어야 했습니다.
  regrets:
    - 아직 운영 배포 전입니다. 알림톡은 실제 업체 계정으로 보내 보지 않았고, 보호자 웹은 개발용 로그인만 있습니다. 운영 환경에 올려 실제 휴대폰과 카카오톡에서 확인하는 것이 다음 할 일입니다.
    - 검색 속도, 실기기 영상 압축 시간, 업로드 실패율은 아직 측정 전입니다. 운영 전에 측정해서 수치로 남기겠습니다.
    - 카카오톡 글 해석은 아직 정해 둔 규칙으로만 합니다. 기록 검색도 찾아 주기만 합니다. 찾은 기록을 요약해 답하는 기능은 유료 모델이 필요해 미뤘습니다.
    - 반복 예약은 서버까지만 만들었고 앱 화면은 아직입니다.
