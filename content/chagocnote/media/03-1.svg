<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">한 DB에 여러 매장 — 문 앞 경비원이 매번 확인</text>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="40" y="130" width="240" height="120" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="160" y="185" fill="#fff">요청</text><text x="160" y="218" fill="#9aa1ad" font-size="16" font-weight="400">/shops/{shop_id}/…</text>
    <rect x="340" y="110" width="400" height="160" rx="18" fill="#0f1115" stroke="#f59e0b" stroke-width="2"/>
    <text x="540" y="160" fill="#fff">라우터 가드 → ShopContext</text>
    <text x="540" y="198" fill="#9aa1ad" font-size="16" font-weight="400">매 요청마다 소속, 권한, 매장 상태를 DB에서 재조회</text>
    <text x="540" y="228" fill="#9aa1ad" font-size="16" font-weight="400">토큰에는 역할을 넣지 않는다</text>
    <rect x="800" y="130" width="360" height="120" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="980" y="185" fill="#fff">저장소</text><text x="980" y="218" fill="#9aa1ad" font-size="16" font-weight="400">ShopContext를 첫 인자로만 받는다</text>
  </g>
  <g fill="#f59e0b" font-size="36" text-anchor="middle"><text x="310" y="200">→</text><text x="770" y="200">→</text></g>
  <rect x="40" y="310" width="540" height="160" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="70" y="355" fill="#fff" font-size="20" font-weight="700">구조 테스트가 누락을 잡는다</text>
  <text x="70" y="392" fill="#9aa1ad" font-size="17">라우트 의존성 트리를 훑어 {shop_id} 경로에</text>
  <text x="70" y="420" fill="#9aa1ad" font-size="17">가드가 없으면 실패 — 손으로 관리하는 목록 없음</text>
  <rect x="620" y="310" width="540" height="160" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="650" y="355" fill="#fff" font-size="20" font-weight="700">인증은 별도 프로세스</text>
  <text x="650" y="392" fill="#9aa1ad" font-size="17">발급 서버만 RS256 개인키를 가지고</text>
  <text x="650" y="420" fill="#9aa1ad" font-size="17">API는 공개키로 검증만 — Caddy가 경로로 분리</text>
  <rect x="40" y="510" width="1120" height="110" rx="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="558" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">새 모듈의 첫 통합 테스트는 언제나 "A매장 직원 → B매장 = 403"</text>
  <text x="600" y="592" fill="#fde2b0" font-size="17" text-anchor="middle">대가: 매장 범위 요청 하나에 조회 3번 (캐시는 넣지 않았다)</text>
</svg>
