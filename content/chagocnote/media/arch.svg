<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9aa1ad"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="56" fill="#fff" font-size="28" font-weight="700">차곡노트 전체 구조</text>
  <text x="40" y="88" fill="#9aa1ad" font-size="17">매장 앱의 미용 기록이 보호자의 알림장 링크가 되기까지</text>

  <!-- 사진, 영상 직접 업로드 -->
  <path d="M140 160 L140 118 L1040 118 L1040 146" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#b)"/>
  <text x="590" y="110" fill="#f59e0b" font-size="15" text-anchor="middle">사진과 영상은 서버를 거치지 않고 저장소로 바로 올립니다 (15분짜리 업로드 주소)</text>

  <!-- 왼쪽: 사용자 쪽 -->
  <g font-size="18" text-anchor="middle">
    <rect x="40" y="160" width="200" height="90" rx="14" fill="#0f1115" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="194" fill="#fff" font-weight="700">매장 앱</text>
    <text x="140" y="218" fill="#9aa1ad" font-size="14">Flutter, iOS와 Android</text>
    <text x="140" y="238" fill="#9aa1ad" font-size="14">예약, 고객, 미용 기록</text>

    <rect x="40" y="340" width="200" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="140" y="374" fill="#fff" font-weight="700">보호자 웹</text>
    <text x="140" y="398" fill="#9aa1ad" font-size="14">Next.js 서버</text>

    <rect x="40" y="480" width="200" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="140" y="514" fill="#fff" font-weight="700">보호자 브라우저</text>
    <text x="140" y="538" fill="#9aa1ad" font-size="14">로그인 없이 링크로 열기</text>
  </g>
  <line x1="140" y1="480" x2="140" y2="424" stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)"/>

  <!-- 게이트웨이 -->
  <rect x="290" y="250" width="160" height="90" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="370" y="286" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">게이트웨이</text>
  <text x="370" y="310" fill="#9aa1ad" font-size="14" text-anchor="middle">Caddy</text>
  <text x="370" y="328" fill="#9aa1ad" font-size="13" text-anchor="middle">주소별로 두 서버에 나눔</text>
  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M240 205 C 265 205, 265 280, 286 280"/>
    <path d="M240 380 C 265 380, 265 312, 286 312"/>
  </g>

  <!-- 가운데: 서버 -->
  <rect x="490" y="140" width="390" height="430" rx="20" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="510" y="172" fill="#f59e0b" font-size="18" font-weight="700">서버 (FastAPI)</text>

  <rect x="510" y="190" width="350" height="75" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="685" y="222" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">로그인 서버</text>
  <text x="685" y="248" fill="#9aa1ad" font-size="14" text-anchor="middle">토큰 서명 열쇠는 여기에만 둡니다</text>

  <rect x="510" y="300" width="350" height="70" rx="14" fill="#f59e0b"/>
  <text x="685" y="331" fill="#1a1206" font-size="18" font-weight="700" text-anchor="middle">① 매장 소속 확인</text>
  <text x="685" y="355" fill="#1a1206" font-size="14" text-anchor="middle">매장 요청마다 DB에서 다시 확인</text>

  <rect x="510" y="400" width="350" height="100" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="685" y="434" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">② API 서버</text>
  <text x="685" y="460" fill="#9aa1ad" font-size="14" text-anchor="middle">매장, 고객, 방문 기록, 미디어, 알림장</text>
  <text x="685" y="482" fill="#9aa1ad" font-size="14" text-anchor="middle">모듈끼리 직접 참조 금지 (자동 검사 6종)</text>
  <line x1="685" y1="370" x2="685" y2="396" stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)"/>

  <text x="685" y="540" fill="#9aa1ad" font-size="14" text-anchor="middle">알림장 링크는 서명을 먼저 맞춰 보고 통과한 것만 조회</text>

  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M450 280 C 475 280, 475 228, 506 228"/>
    <path d="M450 312 C 475 312, 475 335, 506 335"/>
  </g>

  <!-- 오른쪽: 데이터 -->
  <g font-size="18" text-anchor="middle">
    <rect x="920" y="150" width="240" height="95" rx="14" fill="#0f1115" stroke="#f59e0b" stroke-width="2"/>
    <text x="1040" y="182" fill="#fff" font-weight="700">미디어 저장소</text>
    <text x="1040" y="206" fill="#9aa1ad" font-size="14">개발 MinIO, 운영 S3</text>
    <text x="1040" y="228" fill="#9aa1ad" font-size="14">원본, 표시용, 썸네일</text>

    <rect x="920" y="300" width="240" height="75" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="1040" y="332" fill="#fff" font-weight="700">PostgreSQL</text>
    <text x="1040" y="356" fill="#9aa1ad" font-size="14">여러 매장이 함께 쓰는 DB</text>

    <rect x="920" y="420" width="240" height="75" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="1040" y="452" fill="#fff" font-weight="700">Redis</text>
    <text x="1040" y="476" fill="#9aa1ad" font-size="14">틀린 링크 횟수 제한</text>
  </g>
  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M860 228 C 890 228, 890 325, 916 325"/>
    <path d="M860 440 C 890 440, 890 350, 916 350"/>
    <path d="M860 460 C 890 460, 890 457, 916 457"/>
  </g>

  <text x="600" y="630" fill="#9aa1ad" font-size="16" text-anchor="middle">개발 환경은 Docker Compose로 한 번에 띄웁니다. 운영 배포 전이며 보호자 웹은 Vercel에 둘 예정입니다.</text>
</svg>
