name: 장민석
role: AI 백엔드 엔지니어 (LLM, RAG)
headline: LLM이 틀려도 서비스는 틀리지 않게
intro: >-
  LLM 서비스의 백엔드를 설계하고 화면(Next.js, Flutter)까지 직접 만들어 끝까지 책임집니다.
highlights:
  - keyword: 평가 기반 개발
    text: 골든셋 회귀 평가와 모델 비교 게이트를 통과한 모델과 프롬프트 변경만 반영합니다.
  - keyword: 검색엔진과 RAG
    text: pgvector와 Elasticsearch로 RAG를 만들고 하이브리드 검색도 직접 측정해 채택 여부를 정합니다.
  - keyword: 결정론 가드와 개인정보 보호
    text: LLM이 숫자를 지어내지 못하게 최종 값은 코드가 정하고 개인정보는 화면에 뜨기 전에 가립니다.
  - keyword: 헥사고날과 클린 아키텍처
    text: import-linter로 레이어 의존을 강제하고 k3s와 Docker로 직접 배포해 운영합니다.
  - keyword: AI 코딩 어시스턴트와 하네스
    text: Claude Code와 함께 개발하되, 규칙 문서와 하네스로 경계와 검증을 먼저 고정합니다.
requirements:
  - id: python-backend
    label: Python 백엔드 (FastAPI)
    detail: 헥사고날과 클린 아키텍처, import-linter로 레이어 의존 강제
  - id: search-engine
    label: 검색엔진 구축과 활용
    detail: 검색 품질을 골든셋(nDCG, MRR)으로 측정하고 개선 여부를 판정
  - id: rag
    label: RAG 설계와 적용
    detail: 청크, 임베딩, 프롬프트, 출처 표기, 골든셋 회귀 평가
  - id: hybrid-search
    label: 하이브리드 검색 (Sparse + Dense)
    detail: 키워드 검색과 벡터 검색을 RRF로 융합하고 측정 게이트로 채택과 기각을 판정
  - id: linux-docker
    label: Linux와 Docker 배포
    detail: Docker Compose, k3s, 리버스 프록시와 터널 운영
  - id: git
    label: Git 협업
    detail: 팀 프로젝트 브랜치 전략, CI, 커밋 컨벤션
  - id: ai-assistant
    label: AI 코딩 어시스턴트 활용
    detail: 규칙 문서와 하네스로 에이전트의 경계와 검증을 고정
