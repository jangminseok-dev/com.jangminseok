name: 장민석
headline: 검색과 RAG로 답을 찾는 백엔드 개발자
intro: >-
  검색과 LLM으로 근거를 대며 답하는 시스템을 만들고 좋아졌는지는 늘 숫자로 확인합니다.
highlights:
  - keyword: 헥사고날 · 클린 아키텍처
    text: import-linter 계약으로 레이어 의존을 강제해 구조가 무너지지 않는 FastAPI 백엔드를 설계합니다.
  - keyword: 검색엔진 · RAG
    text: Elasticsearch·pgvector 검색 위에 출처를 제시하는 RAG를 만들고 하이브리드 검색도 골든셋으로 측정해 채택 여부를 판단합니다.
  - keyword: LLM · ML 평가
    text: 모델은 같은 골든셋과 결정적 게이트로 비교해 고르고 품질 변화는 회귀 테스트로 관리합니다.
  - keyword: AI 코딩 어시스턴트 · 하네스
    text: AI 코딩 어시스턴트와 함께 개발하되, 규칙 문서와 하네스로 경계와 검증을 먼저 고정합니다.
requirements:
  - id: python-backend
    label: Python 백엔드 (FastAPI)
    detail: 헥사고날·클린 아키텍처, import-linter로 레이어 의존 강제
  - id: search-engine
    label: 검색엔진 구축·활용
    detail: 검색 품질을 골든셋(nDCG·MRR)으로 측정하고 개선 여부를 판정
  - id: rag
    label: RAG 설계와 적용
    detail: 청크·임베딩·프롬프트·출처 표기, 골든셋 회귀 평가
  - id: hybrid-search
    label: 하이브리드 검색 (Sparse + Dense)
    detail: 키워드 검색과 벡터 검색을 RRF로 융합하고 측정 게이트로 채택·기각을 판정
  - id: linux-docker
    label: Linux · Docker 배포
    detail: Docker Compose, k3s, 리버스 프록시·터널 운영
  - id: git
    label: Git 협업
    detail: 팀 프로젝트 브랜치 전략, CI, 커밋 컨벤션
  - id: ai-assistant
    label: AI 코딩 어시스턴트 활용
    detail: 규칙 문서·하네스로 에이전트의 경계와 검증을 고정
