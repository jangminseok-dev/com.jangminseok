name: 장민석
role: LLM, RAG, AI 에이전트
headline: RAG 파이프라인 설계부터 운영까지, Python, FastAPI AI 백엔드 개발자
intro: >-
  검색과 RAG로 답하는 LLM 서비스를 설계하고, 화면(Next.js, Flutter)부터 평가와 배포, 운영까지 직접 맡습니다.
highlights:
  - keyword: 평가 기반 개발
    text: 기능을 고치기 전에 정답을 정해 둔 골든셋부터 만들고, 회귀 평가를 통과한 변경만 반영합니다. 로컬 LLM도 같은 골든셋으로 비교해서 고릅니다.
  - keyword: 검색엔진과 RAG
    text: RAG를 만들 때는 pgvector, Elasticsearch, 하이브리드 검색을 직접 측정해 보고 검색 방식을 정합니다. 개인정보는 저장하거나 화면에 표시하기 전에 먼저 마스킹합니다.
  - keyword: 에이전트와 도구 호출
    text: LLM이 쓸 도구는 Function Calling으로 한 번만 구현하고, 같은 도구를 MCP 서버로도 공개해 다른 AI 앱에서 쓸 수 있게 합니다.
  - keyword: 설계와 하네스
    text: 헥사고날과 Clean Architecture, DDD, SOLID 원칙을 지키고 레이어 의존은 import-linter로 강제합니다. Claude Code로 바이브 코딩할 때는 규칙 문서와 Agent Harness로 경계를 먼저 고정합니다.
  - keyword: 배포와 운영
    text: GitHub Actions로 push할 때마다 테스트와 의존 규칙 검사를 자동으로 실행하고, Docker와 Kubernetes, Vercel로 직접 배포해 운영합니다.
  - keyword: 인증과 보안
    text: 로그인은 JWT(RS256)로 처리하고, 서명에 쓰는 개인키는 인증 서버에만 둡니다. 리프레시 토큰은 쓸 때마다 새로 발급합니다. 이미 쓴 토큰이 다시 들어오면 탈취로 보고 그 사용자의 세션을 모두 끊습니다. 인증은 FastAPI Depends 한곳에서 처리하며, 인증이 빠진 API는 테스트가 찾아냅니다.
requirements:
  - id: python-backend
    label: Python 백엔드 (FastAPI)
    detail: 헥사고날과 클린 아키텍처, import-linter로 레이어 의존 강제
  - id: search-engine
    label: 검색엔진 구축과 활용
    detail: 검색 품질을 골든셋(nDCG, MRR)으로 측정하고 개선 여부를 판정
  - id: rag
    label: RAG 설계와 적용
    detail: 청크, 임베딩, 프롬프트, 출처 표기, 골든셋 회귀 평가
  - id: hybrid-search
    label: 하이브리드 검색 (Sparse + Dense)
    detail: 키워드 검색과 벡터 검색을 RRF로 융합하고 측정 게이트로 채택과 기각을 판정
  - id: agent-tools
    label: LLM 에이전트와 도구 호출 (MCP)
    detail: 상황에 맞는 도구 선택, 도구 선택 정확도 측정, 같은 도구를 MCP 서버로 공개
  - id: linux-docker
    label: Linux와 Docker 배포
    detail: Docker Compose, k3s, 리버스 프록시와 터널 운영
  - id: git
    label: Git 협업
    detail: 팀 프로젝트 브랜치 전략, CI, 커밋 컨벤션
  - id: ai-assistant
    label: AI 코딩 어시스턴트 활용
    detail: 규칙 문서와 하네스로 에이전트의 경계와 검증을 고정
