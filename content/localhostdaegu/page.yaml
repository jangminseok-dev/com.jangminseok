retro:
  metrics:
    - { value: "10명 중 10명", label: 가상 고객 완주, note: 운영 주소 기준 }
    - { value: "30.6초", label: 1인 평균 소요, note: 자동 입력 기준 }
    - { value: "11.2초", label: 상담자료 생성 평균 }
    - { value: "603개, 226개", label: 자동 테스트, note: "백엔드와 프론트엔드, 9월 19일 기준" }
  learned:
    - 운영 주소에서 끝까지 돌려 봐야 보이는 결함이 있었습니다. 가상 고객 10명 테스트에서 결함 7건을 찾아 고쳤습니다.
    - 팀장이 코드를 덜 쓰는 대신 계약과 문서를 먼저 맞추면, 세 사람이 서로를 기다리지 않고 동시에 움직일 수 있었습니다.
    - 숫자를 보여 줄 때는 그 숫자의 기준도 함께 보여 줘야 한다는 것을 배웠습니다. 위험 점수도 비교 기준을 붙이고 나서야 상담자료에 쓸 수 있었습니다.
  regrets:
    - Neo4j와 Redis를 구성만 하고 쓰지 않았습니다. 범위를 더 일찍 잘랐어야 했습니다.
    - 외부 AI에 장애가 나도 로컬 모델로 자동 전환되지 않습니다. 사람이 설정을 바꿔야 합니다.
    - 카드 소비, 생활인구, 실제 매출 데이터를 구하지 못해 상권 판단은 인허가 기록에 기댑니다.

