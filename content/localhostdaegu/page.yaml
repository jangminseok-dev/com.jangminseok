# 프로젝트 소개 페이지 v2: 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 대구에서 가게를 열려는 예비 창업자가 계약 전에 동네 상권을 살펴보고, 필요한 자금을 계산해 은행 상담에 가져갈 자료를 만드는 서비스입니다.
  role: 3인 팀의 팀장으로 API 계약, 배포 구조, 범위와 우선순위, 코드 리뷰와 제출을 맡았습니다.
  why: 가게를 계약한 뒤에는 조건을 바꾸는 데 돈이 듭니다. 계약 전에 월세와 투자비를 넣어 보고, 모자란 돈을 은행과 어떻게 상의할지 미리 정리하도록 돕는 것이 목표입니다. 2026 AI Blockchain Challenge Daegu 출품작입니다.
  highlights:
    - { value: "10명 중 10명", label: 가상 고객 완주, note: 운영 주소에서 첫 입력부터 상담자료까지 끝까지 간 인원 }
    - { value: "11.2초", label: 상담자료 생성 평균, note: 같은 가상 고객 10명 테스트 기준 }
    - { value: "1.4초", label: 첫 AI 문단 도착, note: "운영 도메인과 터널을 거친 측정, 첫 응답은 0.2초" }

features:
  - title: 한 문장으로 시작
    body: "\"서문시장 근처 카페, 예산 5천\"처럼 한 문장만 쓰면 동네와 업종, 예산을 알아듣고 지도로 안내합니다. 긴 지명을 먼저 비교해서 달서구를 서구로 잘못 읽지 않습니다."
    image: media/poster.webp
  - title: 지도에서 동네 상권 보기
    body: 행정동마다 폐업률, 점포 수, 점포 증감률을 색으로 칠하고 연도별 추이를 그립니다. 동네를 누르면 그 업종의 위험 정도를 대구 142개 동 가운데 몇 번째인지로 알려 줍니다. 실패 확률이 아니라는 점도 함께 적습니다.
    image: media/06-1.webp
  - title: 창업자금 사전상담
    body: 보증금, 인테리어, 월세, 자기자본을 넣으면 총 준비자금과 자기자본 밖에서 마련해야 할 돈을 계산합니다. 처음 계획과 바꾼 계획을 나란히 비교하고, 매출이 나쁠 때와 좋을 때의 영업이익도 보여 줍니다.
    core: true
    image: media/03-1.webp
  - title: iM뱅크 상담 후보 상품
    body: 지역과 조건에 맞는 정책자금과 보증 상품을 카드로 보여 줍니다. 공식 자료에서 iM뱅크 취급이 확인된 상품을 먼저 두고, 확인되지 않은 상품은 따로 나눠 보여 줍니다.
    image: media/06-2.webp
  - title: 은행 상담자료 만들기
    body: 계산 결과와 상권 근거를 모아 은행 상담에 가져갈 자료를 만듭니다. 금액과 표는 코드가 계산하고, AI는 그 숫자를 풀어 쓰는 문단과 은행에 물어볼 질문만 씁니다. 지금 어떤 단계를 진행하는지 옆에 보여 줍니다.
    core: true
    image: media/03-2.webp
featureNote: 서비스는 대회가 끝난 뒤 중단했습니다. 개발 기록과 결정 문서는 공개 프로젝트 허브에서 볼 수 있습니다.

architecture:
  image: media/arch.svg
  summary: 화면은 Vercel에 올리고, 서버와 데이터베이스는 GPU 컴퓨터 한 대에서 돌렸습니다. 둘 사이는 Cloudflare Tunnel로 이어서, 서버를 따로 빌리지 않고 인터넷에 공개했습니다.
  points:
    - title: 금액은 코드가, 설명은 AI가
      body: 상담자료의 금액, 표, 점수는 코드가 계산해서 먼저 보냅니다. AI는 그 숫자를 설명하는 문단만 씁니다. 그래서 AI 호출이 실패해도 계산 결과는 그대로 남습니다.
    - title: 비용을 들이지 않는 배포
      body: 대회 예산이 없어 GPU 컴퓨터 한 대를 서버로 썼습니다. 같은 구성으로 운영하던 제 개인 프로젝트 RedOceanMap의 방식을 그대로 가져왔습니다.
    - title: 스트리밍이 프록시에서 막히지 않게
      body: 상담자료는 문단이 만들어지는 대로 조금씩 보냅니다. 프록시가 응답을 버퍼링해 한꺼번에 넘기지 않도록 서버와 프록시 설정을 함께 맞췄습니다. 운영 주소에서 첫 AI 문단이 1.4초 만에 도착하는 것을 확인했습니다.
    - title: uvicorn 워커는 1개로 고정합니다
      body: 진행 중인 분석 요청을 메모리에 담아 두기 때문에, 워커를 여러 개 띄우면 요청을 잃어버립니다. 그래서 워커를 하나로 고정하는 것을 배포 조건으로 적었습니다. 대신 한꺼번에 많은 사람을 받기는 어렵습니다.
  layers:
    - { name: 화면, items: [Next.js 16, React 19, MapLibre, Vercel] }
    - { name: 서버, items: [Python, FastAPI, SQLAlchemy 2, Alembic] }
    - { name: AI, items: [Gemini, Ollama Gemma 4, qwen3-embedding] }
    - { name: 데이터, items: [PostgreSQL, pgvector, 공공데이터 정기 수집] }
    - { name: 배포, items: [Cloudflare Tunnel, Docker, 로컬 GPU 서버] }

role:
  summary: 3명 중 저는 팀장이자 PM과 아키텍트를 맡아, 팀이 함께 지킬 약속과 구조를 먼저 정했습니다. 백엔드는 제 개인 프로젝트 RedOceanMap의 백엔드를 거의 그대로 가져와, 서울 상권 데이터를 대구 상권 데이터로 바꿔 시작했습니다.
  mine:
    - 화면과 서버가 주고받을 데이터 형식을 구현 전에 정한 API 계약
    - 배포 구조 결정과 서버 실행 조건 정리
    - 범위와 우선순위 결정. 블록체인 기록을 빼고, 주 동선을 계약 전 자금 상담으로 바꿨습니다.
    - 코드 리뷰와 머지 승인
    - 위험 점수를 실패 확률처럼 쓰지 않는다는 데이터 표현 원칙
    - 데이터베이스를 19개에서 29개 테이블로 늘린 확장과 구조 문서, 외부 API 키 관리
    - 제안요약서, 시연 대본, 제출 서류와 접수
  team:
    - 지도에서 고른 연도를 AI 분석까지 맞추는 기능과 AI 진행 표시, 백엔드 배포
    - 자금 점검 동선과 계산 가정 표시, 지표의 분모와 기간을 보여 주는 데이터 신뢰 표시, 상대 순위 화면, 프론트엔드 배포
    - 로컬 AI 모델 평가와 연결 코드
  collab:
    - 구현 전에 API 계약부터 정하고, 기능 하나를 한 팀원이 서버부터 화면까지 맡았습니다. 같은 API를 건드리는 두 기능은 한 사람에게 몰았습니다.
    - 공용 파일은 기존 줄을 고치지 않고 추가만 하도록 규칙을 두었습니다. 변경은 기능 브랜치와 PR을 거쳐 팀장이 승인한 뒤 main에 머지했습니다.
    - 팀원 모두 팀이 직접 관리하는 서버 한 대에 SSH로 접속해 코드를 고치고 바로 테스트했습니다. 그래서 커밋 작성자는 서버 계정 하나로 남았고, 실제 담당은 작업 목록과 개발 기록의 담당 표로 구분했습니다.
    - 결정과 아직 풀리지 않은 쟁점에 번호를 붙여 공개 문서에 남겼습니다. 개발 기록과 인수인계 문서는 제가 하루 한 번 통합했습니다.
  ai:
    - 저장소에 Claude Code와 Codex가 따를 작업 규칙 파일을 두고 AI 코딩 도구와 함께 개발했습니다. 큰 작업은 설계 문서와 계획 문서를 먼저 쓴 뒤 구현했습니다.
    - AI가 쓴 코드는 자동 테스트로 확인했습니다. 백엔드 603개, 프론트엔드 226개 테스트와 타입 검사를 통과해야 했고, 화면 흐름은 브라우저 자동 테스트로 끝까지 돌려 봤습니다.

troubles:
  - title: 3명이 5일 안에 부딪히지 않고 나눠 만들기
    problem: 3명이 약 5일 안에 기능을 끝내야 했습니다. 화면 담당과 서버 담당으로 나누면 서로를 기다리고, 같은 파일을 동시에 고쳐 충돌이 날 수 있었습니다.
    solution: 구현 전에 API 계약부터 정했습니다. 분석 요청에 연도를 받는 칸, 계산에 쓴 가정, 지표의 분모와 기간을 담을 칸입니다. 그다음 기능 하나를 한 팀원이 서버부터 화면까지 맡게 나눴습니다. 공용 파일은 추가만 허용했고, 같은 분석 API를 건드리는 두 기능은 한 사람에게 맡겼습니다.
    detail: 나누기 전에 백엔드 460개 파일, 약 13,600줄을 세 영역으로 나눠 리뷰했습니다. 치명적 결함 없이 고친 뒤 머지하라는 판정을 받았고, 수정을 반영해 main에 머지한 지점에서 모두가 출발했습니다.
    result: 나눈 네 기능은 9월 19일까지 모두 반영됐습니다. 9월 18일에 코드 동결을 풀고 개발을 이어 간 뒤 9월 20일에 접수했습니다. 대신 저는 문서를 하루 한 번 직접 맞춰야 했습니다.
    evidence:
      - { label: 팀 분담과 인수인계 (handoff.md), url: "https://github.com/localhostdaegu/cloud.localhostdaegu/blob/main/docs/handoff.md" }
      - { label: 최종 리뷰와 역할 분담 기록, url: "https://github.com/localhostdaegu/053.localhostdaegu.cloud/blob/main/_posts/2026-09-18-final-review-team-split.md" }
      - { label: 결정 기록 (decisions.md), url: "https://github.com/localhostdaegu/053.localhostdaegu.cloud/blob/main/decisions.md" }
  - title: AI가 표 위의 숫자를 두고 "수치가 없다"고 쓰던 문제
    problem: 운영 주소에서 가상 고객 10명을 돌렸더니, 10명 모두의 상담자료 첫 문단이 바로 위 표에 있는 숫자를 두고 수치가 없다고 썼습니다.
    cause: AI에게 보내는 프롬프트에는 "수치는 표에 있다"고만 적고 실제 숫자는 싣지 않았습니다. AI는 보이지 않는 숫자를 없다고 판단했습니다.
    solution: 계획의 숫자를 프롬프트에 그대로 싣고, 숫자를 다시 계산하거나 없다고 쓰지 말라고 명시했습니다. 금액과 표는 코드가 먼저 보내고 AI는 설명 문단만 쓴다는 원칙은 처음 정한 대로 지켰습니다.
    detail: 문서의 금액 표기도 화면과 같은 만원 단위로 맞췄습니다. 지표가 하나도 없는 업종은 AI를 부르지 않고, 집계되지 않았을 뿐 나쁘다는 뜻이 아니라는 문장을 코드가 씁니다.
    result: 같은 10명을 다시 돌렸을 때 이 문단은 한 건도 나오지 않았습니다. AI가 실패해도 계산 결과는 그대로 남습니다.
    evidence:
      - { label: 상담자료 문장과 프롬프트 (report_text.py), url: "https://github.com/localhostdaegu/cloud.localhostdaegu/blob/main/backend/apps/analysis/domain/report_text.py" }
      - { label: 재발 방지 테스트 (test_analysis_sections.py), url: "https://github.com/localhostdaegu/cloud.localhostdaegu/blob/main/backend/tests/test_analysis_sections.py" }
      - { label: 가상 고객 테스트 기록, url: "https://github.com/localhostdaegu/053.localhostdaegu.cloud/blob/main/_posts/2026-09-19-deploy-persona-metrics.md" }
  - title: 돈을 들이지 않는 배포에서 스트리밍 지키기
    problem: 대회 예산이 없었고 GPU는 로컬 컴퓨터 한 대뿐이었습니다. 프록시를 거치면 버퍼링 때문에 조금씩 보내는 AI 문단이 한꺼번에 도착할 수도 있었습니다.
    solution: 화면은 Vercel에 두고, 서버는 로컬 GPU 컴퓨터를 Cloudflare Tunnel로 공개하는 구조로 정했습니다. 서버가 프록시 버퍼링을 끄는 헤더를 보내고, uvicorn 워커는 1개로 고정하고, CORS 허용 오리진은 환경변수로 빼는 것을 배포 조건으로 문서에 적었습니다. 실제 배포 실행은 팀원이 맡았습니다.
    detail: 수집이 실패했을 때 오류 메시지에 요청 주소가 통째로 담겨 외부 API 키 하나가 서버 로그에 남은 일이 있었습니다. 로그 파일은 저장소에 올리지 않아 공개되지는 않았습니다. 모든 외부 연동에서 오류 메시지의 키를 지우도록 고쳤고, 해당 키는 재발급했습니다.
    result: 운영 주소에서 첫 응답이 0.2초, 첫 AI 문단이 1.4초 만에 도착하고 이후 순서대로 이어지는 것을 확인했습니다. 다만 서버가 하나라 동시에 처리할 수 있는 양이 적고, 컴퓨터가 꺼지면 서비스도 멈춥니다.
    evidence:
      - { label: 배포 런북 (deploy-runbook.md), url: "https://github.com/localhostdaegu/cloud.localhostdaegu/blob/main/docs/deploy-runbook.md" }
      - { label: 운영 구성 문서 (architecture.md), url: "https://github.com/localhostdaegu/053.localhostdaegu.cloud/blob/main/docs/architecture.md" }
  - title: 위험 점수가 폐업 확률처럼 읽히던 문제
    problem: 처음 화면은 동네마다 0점에서 100점 사이의 위험 점수를 보여 줬습니다. 80점은 80% 확률로 망한다는 뜻으로 읽힐 수 있어, 은행 상담자료에 쓰기에는 위험했습니다.
    cause: 이 점수는 폐업률, 점포 수, 점포 증감률이 다른 동에 비해 얼마나 높은지를 4 대 4 대 2로 섞은 값입니다. 점포가 늘어도 점수가 오르기 때문에 실패 확률로 읽을 수 있는 값이 아니었습니다.
    solution: 점수를 대구 142개 동 가운데 몇 번째인지로 보여 주고, 실패 확률이 아니라는 문장을 화면에 붙였습니다. 데이터를 얼마나 단정적으로 표현할지에 대한 원칙은 제가 정했고, 화면 구현은 팀원이 맡았습니다.
    detail: 데이터를 직접 조회해 보니 한 동네의 2025년 카페 폐업 182건 가운데 137건이 개업 30일 안에 끝난 기록이었습니다. 실제 폐업인지 신고 정정인지 구분할 수 없어, 이런 기록은 폐업률과 위험도 집계에서 뺐습니다. 이 규칙으로 폐업률이 100%를 넘던 동 2곳이 사라졌습니다.
    result: 점수 옆에 비교 기준이 함께 보입니다. 사용자의 오해가 실제로 줄었는지는 아직 재지 않았습니다.
    evidence:
      - { label: 상대 순위 위험 카드 (risk-card.tsx), url: "https://github.com/localhostdaegu/cloud.localhostdaegu/blob/main/frontend/src/features/map-explorer/components/risk-card.tsx" }
      - { label: 30일 이내 종료 기준 (short_lived.py), url: "https://github.com/localhostdaegu/cloud.localhostdaegu/blob/main/backend/apps/metric/domain/short_lived.py" }
