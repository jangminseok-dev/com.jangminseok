tagline: 반려견의 크기, 견종, 체질과 문화 공공데이터를 교차해, 우리 강아지가 갈 수 있는 곳과 동선을 대화로 짜 주는 반려견 동반 여행 플래너 — 제4회 문화체육관광 인공지능·데이터 활용 공모전
