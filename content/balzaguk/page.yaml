# 프로젝트 소개 페이지 v2: 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 반려견의 크기와 체질에 맞춰, 데리고 갈 수 있는 곳과 여행 코스를 대화로 짜 주는 여행 플래너입니다. 제4회 문화체육관광 인공지능·데이터 활용 공모전에 4인 팀으로 참가해 10일 동안 만들었습니다.
  role: 4인 팀에서 풀스택으로 서버, AI 대화 기능, 데이터, 배포와 서버에 연결되는 화면을 맡았습니다.
  why: 반려견과 여행을 떠나려면 어디에 데리고 들어갈 수 있는지부터 하나하나 확인해야 합니다. 발자국은 공공데이터에 적힌 입장 규정으로 갈 수 있는 곳만 추립니다. 실제로 없는 시설이나 들어갈 수 없는 곳을 추천하지 않는 것이 목표입니다.
  highlights:
    - { value: "2곳 → 967곳", label: 반려견 동반 식당 후보, note: "식당 이름만 맞췄을 때는 2곳" }
    - { value: "30,417곳", label: 담아 둔 반려동물 동반 시설, note: "적재 후 DB를 직접 조회한 값, 2026년 6월 26일 기준" }
    - { value: "0건", label: 정합성 오류, note: "적재 후 점검에서 지역이나 좌표가 빈 행과 짝이 없는 행을 센 값" }

features:
  - title: 대화로 여행 일정 짜기
    body: 어디로 갈지, 무엇을 타고 갈지, 자고 올지를 AI가 차례로 묻습니다. 보호자가 답하면 여행 일정이 바로 채워집니다. 세 가지가 모두 정해지면 코스를 만듭니다. 마이크 버튼을 누르면 말로도 답할 수 있습니다.
    core: true
    image: media/f-chat.webp
  - title: 우리 강아지가 들어갈 수 있는 곳으로만 코스 추천
    body: 반려견의 크기로 입장할 수 있는 시설만 후보로 고릅니다. AI는 그 후보 안에서 순서를 정하고, 고른 이유를 한두 문장으로 붙입니다. 코스는 하루 4곳, 최대 12곳까지 담습니다.
    core: true
    image: media/f-course.webp
  - title: 자동차로 갈 때 들를 곳 추천
    body: 자동차로 간다고 답하면 서울에서 전주로 가는 길 근처의 반려견 동반 명소를 앞, 가운데, 뒤 구간에서 한 곳씩 골라 줍니다. 쉬어 갈 고속도로 휴게소도 한 곳 넣습니다. 휴게소는 공공데이터에 동반 정보가 없어 직접 넣어 둔 2곳 중에서 고릅니다.
  - title: 장소별 입장 가능 여부 확인
    body: 코스의 장소를 누르면 우리 강아지가 들어갈 수 있는지, 조건이 붙는지 알려 줍니다. 들어갈 수 없으면 같은 지역에서 받아 주는 가까운 곳을 3곳까지 대신 보여 줍니다.
  - title: 응급 상황 안내
    body: 반려견의 증상을 말하면 짐작되는 원인과 긴급도, 지금 할 수 있는 주의사항을 알려 줍니다. 진단이 아닌 참고용이며, 가까운 영업 중 동물병원 5곳을 거리순으로 함께 보여 줍니다. 지금 날씨와 견종을 보고 더위 위험도 알려 줍니다.
  - title: 전주 축제와 둘레길 둘러보기
    body: 전주의 축제, 둘레길, 문화시설, 맛집을 카드로 둘러볼 수 있습니다. 위치가 있는 시설은 카드에서 바로 코스에 담을 수 있습니다.
featureNote: 배포가 내려가 지금은 시연 주소가 없습니다. 기능 설명은 저장소에 남은 코드를 기준으로 썼습니다.

architecture:
  image: media/arch.svg
  summary: 보호자가 대화로 조건을 말하면, 서버가 공공데이터에서 갈 수 있는 곳을 먼저 추립니다. AI는 그 안에서 코스의 순서만 고릅니다. 공모전 제출 때 화면은 Vercel에, 서버는 Railway에 올렸습니다.
  points:
    - title: AI는 명단 안에서만 고릅니다
      body: 서버가 DB에서 입장할 수 있는 시설 40곳을 번호와 함께 AI에게 넘깁니다. AI는 번호로만 답하고, 코드는 그 번호를 명단과 다시 대조합니다. AI가 답하지 못하면 가까운 곳부터 잇는 단순한 규칙이 대신 코스를 만듭니다.
    - title: 안전과 규정은 규칙이 판단합니다
      body: 입장할 수 있는지는 공공데이터의 허용 크기를 보고 코드가 판정합니다. 증상 안내에는 AI를 쓰지만, 답에 수의사 진료 안내가 빠지면 코드가 덧붙입니다. 긴급도도 정해진 세 단계로만 받습니다.
    - title: 길찾기 서비스 없이 들를 곳을 고릅니다
      body: 서울과 전주를 잇는 직선을 긋고, 그 직선에서 18km 안에 있는 시설만 남깁니다. 외부 길찾기 서비스에 기대지 않으려고 고른 방법입니다(실제 도로와의 차이는 측정 전). 지도에 그리는 경로선은 따로입니다. 화면이 OSRM 공개 서버를 불러 도로를 따라 그리고, 실패하면 직선으로 잇습니다.
    - title: 화면과 서버를 이미지 하나에 담았습니다
      body: 빌드한 화면 파일을 서버가 같은 주소에서 함께 내보내서, Railway 주소 하나로도 서비스가 뜹니다. Vercel에 올린 화면은 /api로 오는 요청을 Railway로 넘깁니다. 그래서 빌드 시점에 넣는 값은 지도 클라이언트 ID 하나만 남았습니다. 서버가 켜지면 대표 코스를 미리 계산해 두어 첫 시연 요청에 대비합니다.
  layers:
    - { name: 화면, items: [React 19, Vite, 네이버 지도] }
    - { name: 서버, items: [Python 3.13, FastAPI, SQLAlchemy 2, Alembic] }
    - { name: AI, items: [Gemini] }
    - { name: 데이터, items: [PostgreSQL, Neon, pandas, pyproj] }
    - { name: 배포, items: [Docker, Railway, Vercel] }

role:
  summary: 4명 중 풀스택으로 참여해 서버, AI 대화 기능, 공공데이터 적재와 DB 설계, 배포를 맡았습니다. 배포한 앱의 화면은 제가 모두 만들었습니다. 팀원은 별도 브랜치에서 홍보용 메인 페이지와 플래너, 응급 안내 화면을 따로 만들어 제 서버에 연결했고, 이 작업은 main 브랜치에 합쳐지지 않았습니다.
  mine:
    - 서버 뼈대와 기능별 API
    - Gemini로 여행 일정을 짜는 대화, 코스 추천, 증상 안내와 그 결과를 검증하는 규칙
    - 공공데이터 적재 스크립트와 DB 설계
    - 자동차로 갈 때 들를 곳을 고르는 기능
    - Docker 이미지와 Railway, Vercel 배포
    - 배포한 앱의 화면 전체 (대화 플래너, 코스, 장소 상세, 응급 안내 등)
  team:
    - 별도 브랜치의 홍보용 메인 페이지와 플래너, 응급 안내 화면 (main 브랜치에는 합쳐지지 않음)
  collab:
    - 공모전 신청서는 팀원 공용 작성 가이드를 두고 함께 썼습니다. 모두가 같은 수치와 데이터 출처로 양식을 채우게 하려는 문서입니다.
    - 가이드에는 코드와 실측으로 확인한 값만 적었습니다. 확인되지 않은 값은 '확인 필요'로 표시해 아무도 임의로 채우지 않게 했습니다.
  ai:
    - 대화형 플래너로 방향을 바꿀 때 Claude Code에 맡길 작업 지시서를 먼저 썼습니다. 지시서에는 만드는 순서, 외부 서비스 없이도 끝까지 도는 모의 데이터 경로, 비밀키를 저장소에 올리지 않는 규칙을 적었습니다.
    - 10일짜리 공모전이라 자동 테스트는 사용자 모듈(10개)에 두고, 나머지는 주소를 직접 호출해 보고, 타입 검사와 빌드를 돌리고, 브라우저 자동화 도구로 화면을 확인했습니다.

troubles:
  - title: AI가 없는 시설을 추천하지 못하게 막기
    problem: AI에게 코스를 맡기면 실제로 없는 시설을 지어내거나, 읽을 수 없는 형식으로 답할 수 있습니다. 반려견과 보호자에게는 헛걸음이 됩니다.
    solution: AI가 고를 수 있는 범위를 먼저 좁혔습니다. DB에서 우리 강아지 크기로 들어갈 수 있는 시설만 추리고, 기준점에서 가까운 40곳을 번호와 함께 AI에게 줍니다. AI는 그 번호 중에서 순서만 골라 답합니다. 돌아온 번호는 코드가 명단과 다시 대조하고, 명단에 없는 번호는 버립니다.
    detail: AI 키가 없거나 호출이 실패하거나 답을 읽을 수 없으면, 가장 가까운 곳부터 차례로 잇는 규칙이 대신 코스를 만듭니다. 증상 안내에도 같은 방식을 썼습니다. 답에 수의사 진료 안내가 없으면 안내 문구를 덧붙이고, 긴급도가 정해진 세 값이 아니면 '주의'로 되돌립니다. AI의 답을 정해진 형식으로 읽지 못한 경우까지 이 보강을 거치게 하는 것이 다음 과제입니다.
    result: 명단에 없는 시설은 화면까지 갈 길이 없습니다. AI가 답하지 못해도 코스 추천은 계속 동작합니다.
    evidence:
      - { label: 후보 명단 대조와 대체 규칙 (route_planner_repository.py), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/adapdog/apps/map/adapter/outbound/repositories/route_planner_repository.py" }
      - { label: 증상 안내의 안내 문구와 긴급도 제한 (symptom_check_repository.py), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/adapdog/apps/care/adapter/outbound/repositories/symptom_check_repository.py" }
  - title: 가벼운 AI 모델이 같은 질문을 되풀이하던 문제
    problem: 빠르고 가벼운 Gemini 모델을 썼습니다. 이 모델은 예시로 넣어 둔 지역 이름을 사용자의 목적지로 옮겨 적었습니다. 이미 들은 이동 수단을 다시 묻기도 했습니다.
    solution: 네 가지를 차례로 더했습니다. 먼저 예시 문장에서 특정 여행지를 지웠습니다. 매번 지금까지 정해진 내용을 AI에게 함께 보내 다시 묻지 않게 했습니다. AI가 적은 목적지가 사용자가 실제로 한 말에 없으면 코드가 버립니다. 마지막으로 코스를 만들 때가 되었는지는 AI가 아니라 규칙이 정합니다.
    detail: 목적지, 이동 수단, 숙박 세 가지가 모두 정해져야 코스를 만듭니다. 출발 시각은 묻지 않고 오전 9시로 정했습니다. AI 호출이 실패하면 규칙이 다음 질문과 선택 버튼을 보여 줘서 대화가 끊기지 않습니다.
    result: AI의 답이 흔들려도 코스를 만드는 시점은 바뀌지 않습니다. 대화가 끝까지 이어지는 비율은 아직 재지 않았습니다 (측정 전).
    evidence:
      - { label: 대화 처리와 목적지 확인 (route_planner_interactor.py), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/adapdog/apps/map/app/use_cases/route_planner_interactor.py" }
      - { label: 코스 생성 시점을 정하는 규칙 (route_planner_entity.py), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/adapdog/apps/map/domain/entities/route_planner_entity.py" }
  - title: 기관마다 형식이 다른 공공데이터를 한 기준으로 맞추기
    problem: 공공데이터 파일은 기관마다 문자 인코딩이 달랐습니다. 위치도 위도와 경도로 적힌 파일과 TM 좌표로 적힌 파일이 섞여 있었습니다. 같은 시설이 두 번 들어 있거나, 바다 한가운데 찍힌 시설도 있었습니다.
    solution: 파일마다 인코딩을 지정해 읽고, TM 좌표는 위도와 경도로 바꿨습니다. 이름과 좌표가 완전히 같은 행은 하나로 합쳤습니다. 시군구마다 시설 위치의 중앙값을 구하고, 거기서 50km 넘게 떨어진 시설은 적재 전에 뺐습니다. 시설 정보, 반려동물 규정, 입장 가능한 크기는 서로 다른 테이블로 나눠 담았습니다.
    detail: 중앙값을 쓴 이유는 튀는 값 몇 개에 흔들리지 않기 때문입니다. 행정 경계 같은 외부 자료 없이도 계산할 수 있습니다. 시설이 5곳보다 적은 시군구는 중앙값을 믿기 어려워 건너뜁니다.
    result: 시설 30,417곳, 입장 가능 크기 88,678건, 동물병원 9,299곳을 담았습니다. 적재 후 점검에서 지역이나 좌표가 빈 행과 짝이 없는 행은 0건이었습니다. 이상치로 빠진 시설 수는 따로 세지 않았습니다 (측정 전).
    evidence:
      - { label: 시설 적재와 좌표 이상치 제외 (ingest_facilities.py), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/adapdog/scripts/ingest_facilities.py" }
      - { label: 적재 실측과 정합성 점검 (발자국_ERD.md), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/_docs/%EB%B0%9C%EC%9E%90%EA%B5%AD_ERD.md" }
  - title: 반려견과 함께 들어갈 식당이 2곳뿐이던 문제
    problem: 코스에 점심과 저녁을 먹을 곳을 넣으려 했습니다. 그런데 전주 음식점 목록과 반려동물 동반 시설 목록을 식당 이름으로 맞춰 보니 겹치는 곳이 2곳뿐이었습니다.
    solution: 이름을 맞추는 대신, 반려동물 동반 시설 자료 안의 음식점과 카페를 동반 가능 식당으로 직접 담았습니다. 한국관광공사의 반려동물 동반 여행 음식점 정보도 함께 담았습니다. 식사 자리에는 이 식당들만 넣고, 입장 판정을 한 번 더 거쳐 우리 강아지를 받지 않는 곳은 뺍니다.
    result: 반려견 동반 식당 후보가 967곳으로 늘었습니다.
    evidence:
      - { label: 음식점 적재 (ingest_restaurants.py), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/adapdog/scripts/ingest_restaurants.py" }
      - { label: 동반 식당 보강 기록 (발자국_ERD.md), url: "https://github.com/jangminseok-dev/cloud.adapdog/blob/main/_docs/%EB%B0%9C%EC%9E%90%EA%B5%AD_ERD.md" }

retro:
  metrics:
    - { value: "30,417곳", label: 반려동물 동반 시설 적재 }
    - { value: "967곳", label: 반려견 동반 식당 후보, note: 식당 이름만 맞췄을 때는 2곳 }
    - { value: "0건", label: 정합성 오류, note: 적재 후 점검 기준 }
  learned:
    - AI에게 맡길 일과 코드가 지킬 일을 먼저 나눠야 했습니다. AI에게는 명단 안에서 고르는 일만 주고 검증과 대체 규칙은 코드에 두었습니다. 그래서 AI가 실패해도 코스가 나오는 구조가 되었습니다.
    - 공공데이터는 적재한 뒤 직접 세어 봐야 믿을 수 있었습니다. 행 수와 빈 값을 조회해 보고 나서야 테이블을 나눈 설계대로 들어갔는지 확인할 수 있었습니다.
  regrets:
    - 적재 스크립트마다 좌표계 설정이 달랐습니다. 다음에는 시설 쪽과 동물병원 쪽 설정을 한 곳에 모아 두겠습니다.
    - AI 결과 검증과 대체 규칙은 테스트 대신 직접 호출로 확인했습니다. 이후 CallGuard와 이 포트폴리오에서는 테스트를 먼저 쓰고 구현했습니다.
    - AI가 도구를 직접 부르는 설계에서 후보를 한 번에 넘기는 방식으로 바꿨지만, 설계 문서에는 반영하지 못했습니다. 이후 프로젝트에서는 결정이 바뀔 때마다 결정 기록을 남겼습니다.

