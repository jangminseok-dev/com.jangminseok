<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><rect width="1200" height="675" fill="#181b22"/>  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">화면과 서버를 한 상자에 — 단일 컨테이너</text>
  <rect x="40" y="110" width="700" height="330" rx="22" fill="#0f1115" stroke="#14b8a6" stroke-width="2"/>
  <text x="390" y="155" fill="#14b8a6" font-size="21" font-weight="700" text-anchor="middle">Docker 멀티스테이지 이미지</text>
  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="80" y="185" width="290" height="100" rx="14" fill="#181b22"/><text x="225" y="228" fill="#fff">node:22 빌드</text><text x="225" y="258" fill="#9aa1ad" font-size="15" font-weight="400">React · Vite 정적 파일</text>
    <rect x="410" y="185" width="290" height="100" rx="14" fill="#181b22"/><text x="555" y="228" fill="#fff">python:3.13 실행</text><text x="555" y="258" fill="#9aa1ad" font-size="15" font-weight="400">FastAPI가 같은 오리진에서 서빙</text>
    <rect x="80" y="310" width="620" height="100" rx="14" fill="#181b22"/><text x="390" y="352" fill="#fff">부팅: alembic upgrade → 대표 코스 미리 계산</text><text x="390" y="382" fill="#9aa1ad" font-size="15" font-weight="400">같은 키 동시 요청은 asyncio.Lock으로 한 번만 계산</text>
  </g>
  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="820" y="130" width="340" height="110" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="990" y="180" fill="#fff">Vercel</text><text x="990" y="212" fill="#9aa1ad" font-size="16" font-weight="400">/api 를 서버로 rewrite</text>
    <rect x="820" y="300" width="340" height="110" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="990" y="350" fill="#fff">Railway</text><text x="990" y="382" fill="#9aa1ad" font-size="16" font-weight="400">컨테이너 하나</text>
  </g>
  <text x="990" y="280" fill="#14b8a6" font-size="32" text-anchor="middle">↓</text>
  <text x="40" y="510" fill="#fff" font-size="21" font-weight="700">CORS · 환경변수 관리가 한 곳으로 — 첫 시연 요청도 바로 응답</text>
  <text x="40" y="548" fill="#9aa1ad" font-size="18">SPA 폴백은 /api/ 오타에 404를 정직하게 돌려준다</text>
  <text x="40" y="582" fill="#9aa1ad" font-size="18">대가: 캐시가 프로세스 메모리에만 — 데이터가 고정된 데모라는 전제</text>
</svg>
