<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa1ad"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="56" fill="#fff" font-size="28" font-weight="700">발자국 전체 구조</text>
  <text x="40" y="88" fill="#9aa1ad" font-size="17">보호자의 대화가 우리 강아지가 갈 수 있는 코스가 되기까지</text>

  <!-- 왼쪽: 보호자 화면 -->
  <g font-size="18" text-anchor="middle">
    <rect x="40" y="170" width="170" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="125" y="204" fill="#fff" font-weight="700">보호자 화면</text>
    <text x="125" y="228" fill="#9aa1ad" font-size="14">React, 대화와 지도</text>
    <rect x="40" y="300" width="170" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="125" y="334" fill="#fff" font-weight="700">Vercel</text>
    <text x="125" y="358" fill="#9aa1ad" font-size="14">/api 요청을 서버로</text>
  </g>
  <g stroke="#9aa1ad" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="125" y1="254" x2="125" y2="296"/>
    <line x1="214" y1="340" x2="286" y2="340"/>
  </g>

  <!-- 가운데: 서버 컨테이너 -->
  <rect x="290" y="130" width="620" height="440" rx="20" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="162" fill="#14b8a6" font-size="18" font-weight="700">서버 컨테이너 (FastAPI, Railway)</text>
  <text x="890" y="162" fill="#9aa1ad" font-size="14" text-anchor="end">화면 파일도 같은 주소에서 제공</text>

  <!-- 코스 추천 흐름 -->
  <rect x="310" y="190" width="180" height="70" rx="14" fill="#14b8a6"/>
  <text x="400" y="222" fill="#062320" font-size="18" font-weight="700" text-anchor="middle">① 대화 정리</text>
  <text x="400" y="246" fill="#062320" font-size="14" text-anchor="middle">코스 만들 시점은 규칙이</text>

  <g font-size="17" text-anchor="middle">
    <rect x="520" y="190" width="170" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="605" y="222" fill="#fff" font-weight="700">② 후보 추리기</text>
    <text x="605" y="246" fill="#9aa1ad" font-size="14">들어갈 수 있는 40곳</text>
    <rect x="720" y="190" width="170" height="70" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="805" y="222" fill="#fff" font-weight="700">③ Gemini</text>
    <text x="805" y="246" fill="#9aa1ad" font-size="14">후보 안에서 순서 선택</text>
    <rect x="720" y="310" width="170" height="70" rx="14" fill="#0f1115" stroke="#14b8a6" stroke-width="2"/>
    <text x="805" y="342" fill="#fff" font-weight="700">④ 명단 대조</text>
    <text x="805" y="366" fill="#9aa1ad" font-size="14">명단 밖 시설은 버림</text>
    <rect x="500" y="310" width="190" height="70" rx="14" fill="#0f1115" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="595" y="342" fill="#fff" font-weight="700">대체 규칙</text>
    <text x="595" y="366" fill="#9aa1ad" font-size="14">AI가 실패하면 가까운 순서로</text>
  </g>
  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="490" y1="225" x2="516" y2="225"/>
    <line x1="690" y1="225" x2="716" y2="225"/>
    <line x1="805" y1="260" x2="805" y2="306"/>
    <path d="M760 260 C 760 290, 720 290, 690 306" stroke-dasharray="5 5"/>
  </g>

  <!-- 규칙이 판단하는 기능 -->
  <text x="310" y="428" fill="#14b8a6" font-size="16" font-weight="700">안전과 규정은 규칙이 판단</text>
  <g font-size="17" text-anchor="middle">
    <rect x="310" y="445" width="180" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="400" y="479" fill="#fff" font-weight="700">입장 판정</text>
    <text x="400" y="503" fill="#9aa1ad" font-size="14">공공데이터의 허용 크기로</text>
    <rect x="510" y="445" width="180" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="600" y="479" fill="#fff" font-weight="700">응급 안내</text>
    <text x="600" y="503" fill="#9aa1ad" font-size="14">수의사 안내를 항상 붙임</text>
    <rect x="710" y="445" width="180" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="800" y="479" fill="#fff" font-weight="700">들를 곳 고르기</text>
    <text x="800" y="503" fill="#9aa1ad" font-size="14">서울 전주 직선 18km 안</text>
  </g>

  <!-- 오른쪽: 데이터 -->
  <g font-size="17" text-anchor="middle">
    <rect x="980" y="160" width="190" height="90" rx="16" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="1075" y="195" fill="#fff" font-weight="700">공공데이터 CSV</text>
    <text x="1075" y="219" fill="#9aa1ad" font-size="14">좌표 변환, 중복 제거,</text>
    <text x="1075" y="238" fill="#9aa1ad" font-size="14">이상치는 적재 전 제외</text>
    <rect x="980" y="300" width="190" height="90" rx="16" fill="#0f1115" stroke="#14b8a6" stroke-width="2"/>
    <text x="1075" y="335" fill="#fff" font-weight="700">PostgreSQL</text>
    <text x="1075" y="359" fill="#9aa1ad" font-size="14">Neon, 시설 30,417곳</text>
    <text x="1075" y="378" fill="#9aa1ad" font-size="14">동물병원 9,299곳</text>
    <rect x="980" y="445" width="190" height="80" rx="16" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="1075" y="479" fill="#fff" font-weight="700">기상청 날씨</text>
    <text x="1075" y="503" fill="#9aa1ad" font-size="14">더위 위험 판단</text>
  </g>
  <text x="1086" y="280" fill="#9aa1ad" font-size="13">적재 스크립트</text>
  <g stroke="#9aa1ad" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="1075" y1="250" x2="1075" y2="296"/>
    <path d="M976 330 C 940 330, 940 285, 900 285 L 640 285 L 620 264"/>
    <path d="M976 500 C 930 500, 930 550, 880 550 L 620 550 L 604 529"/>
  </g>

  <text x="600" y="630" fill="#9aa1ad" font-size="16" text-anchor="middle">배포: Docker 이미지 하나를 Railway에서 실행, 서버가 켜지면 대표 코스를 미리 계산</text>
</svg>
