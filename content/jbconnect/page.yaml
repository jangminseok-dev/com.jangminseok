# 프로젝트 소개 페이지 v2. 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 고객이 말이나 글로 AI 금융 도우미와 상담하는 서비스입니다. 상담이 끝나면 번호표가 나오고, 상담 내용은 요약 카드가 되어 창구 직원에게 먼저 전달됩니다. 대기실 화면이 고객을 부르는 데까지 한 흐름으로 이어집니다. 처음에는 60세 이상 고객 전용으로 만들었고, 둘째 날 밤 커밋에서 대상을 모든 고객으로 넓히면서 서비스 이름도 JB AI Connect로 바꿨습니다.
  role: 4인 팀에서 서버와 화면 3개를 모두 혼자 개발했습니다.
  why: 고령 고객에게는 작은 글씨와 타이핑이 큰 장벽입니다. 창구 직원은 고객이 무엇 때문에 왔는지 처음부터 다시 물어야 합니다. 말로 시작한 상담을 창구까지 그대로 이어 주는 것이 목표였습니다. JB금융그룹 Fin:AI Challenge에 내려고 3일 동안 만든 시연용 서비스입니다.
  highlights:
    - { value: "5개", label: 서버 기능, note: "상담, 지점, 법인 안내, 예약, 대기열" }
    - { value: "3개", label: 따로 만든 화면, note: "고객 휴대폰, 창구 단말, 대기실 모니터" }
    - { value: "26개", label: 서버 자동 테스트 }

features:
  - title: 말로도 글로도 하는 AI 상담
    body: 마이크 버튼을 누르고 말하면 한 문장이 끝나는 대로 바로 전송됩니다. 글자를 칠 필요가 없습니다. AI 도우미는 존댓말로 세 문장 안에서, 한 번에 한 가지씩 답합니다. 기본 글자 크기는 18px로 크게 잡았습니다.
    core: true
    image: media/03-1.webp
  - title: 창구 직원에게 먼저 가는 상담 요약 카드
    body: 상담 내용을 AI가 방문 목적, 필요 서류, 직원이 미리 준비할 점으로 정리해 창구 화면에 띄웁니다. 요약이 틀릴 수 있어서 고객이 실제로 한 말도 카드에 함께 남깁니다.
    core: true
    image: media/05-2.webp
  - title: 가기 전에 미리 받는 번호표
    body: 방문할 지점과 용건을 고르면 번호표를 미리 받습니다. 대기번호와 도착 예상 시간이 함께 나오고, 필요 없으면 취소할 수 있습니다. 법인 업무는 B로 시작하는 번호를 받습니다.
    image: media/preview-poster.webp
  - title: 가까운 지점 찾기
    body: 네이버 지역 검색으로 전북은행 지점을 찾아, 지금 위치에서 가까운 순서로 거리와 함께 보여 줍니다. 검색이 실패하면 미리 준비해 둔 데모 지점 목록으로 대신 보여 줍니다.
  - title: 법인 서류 안내
    body: 사업자등록이나 법인 통장 개설처럼 법인 업무를 물으면 필요한 서류와 예상 비용을 알려 줍니다. 서류를 떼는 기관도 가까운 곳부터 세 곳을 추천합니다.
  - title: 대기실 호출 화면
    body: 창구 직원이 호출 버튼을 누르면 대기실 모니터에 번호와 창구가 크게 뜹니다. 도착하지 않은 번호표는 30분 뒤, 호출한 번호는 1분 뒤 목록에서 저절로 사라집니다.
    image: media/05-3.webp
featureNote: 이 페이지의 화면은 외부 AI 키 없이 로컬에서 찍었습니다. 그래서 창구 요약 카드에는 AI 대신 기본값이 들어가 있습니다.

architecture:
  image: media/arch.svg
  summary: 고객, 창구, 호출 화면 3개가 같은 서버를 바라봅니다. 서버 안의 다섯 기능은 모두 같은 레이어 구조로 쌓았습니다. 바깥 시스템은 모두 교체할 수 있는 어댑터로 붙였습니다.
  points:
    - title: 사용자마다 화면을 따로 만들었습니다
      body: 고객 휴대폰, 직원 단말, 대기실 모니터는 쓰는 사람도 화면 크기도 다릅니다. 한 앱에 담으면 글자 크기와 권한이 뒤섞입니다. 그래서 앱 3개로 나누고 모두 같은 서버 주소를 보게 했습니다.
    - title: AI가 멈춰도 시연은 멈추지 않게
      body: 해커톤 시연은 무료 AI 사용 한도에 기대야 합니다. 그래서 Gemini가 실패하면 Groq를, Groq도 실패하면 미리 정해 둔 답을 쓰도록 폴백 순서를 정했습니다. 상담 기능은 이 순서를 몰라도 됩니다. 지도 검색도 같은 방식으로 네이버 다음에 예비 데이터를 두었습니다.
    - title: 은행 시스템이 없어도 끝까지 돌아갑니다
      body: 해커톤에서는 실제 계좌나 고객 정보에 접근할 수 없습니다. 고객 목록, 계좌, 법인 서류 자료, 저장소를 모두 실제 시스템과 같은 포트를 구현한 Mock 어댑터로 만들었습니다. 나중에 실제 시스템으로 바꿔도 업무 규칙 코드는 고치지 않는 것이 원칙입니다.
    - title: 기능끼리 섞이지 않게 자동으로 검사합니다
      body: 3일 안에 기능 다섯 개를 빠르게 붙이면 코드가 서로 엉키기 쉽습니다. 모든 기능을 어댑터, 유스케이스, 도메인의 세 레이어로 나누고, 레이어를 거꾸로 부르는 코드는 import-linter가 막게 했습니다.
  layers:
    - { name: 화면, items: [Next.js 16 앱 3개, Web Speech API] }
    - { name: 서버, items: [Python 3.11, FastAPI, Pydantic 2, import-linter] }
    - { name: AI, items: [Gemini, Groq, 예비 답변] }
    - { name: 데이터, items: [메모리 저장소] }

role:
  summary: 아이디어는 팀원들과 함께 짰고, 개발은 제 맥북 한 대에서 서버 전체와 고객, 창구, 호출 화면 3개를 모두 혼자 구현했습니다.
  mine:
    - 서버의 다섯 기능인 상담, 지점 찾기, 법인 서류 안내, 번호표 예약, 대기열
    - LLM 폴백 체인과 외부 시스템을 대신하는 Mock 어댑터
    - 상담 내용을 창구용 요약 카드로 바꾸는 기능
    - 번호표의 대기, 도착, 호출 상태와 자동 삭제 규칙
    - 고객 앱, 창구 앱, 대기실 호출 화면
    - 레이어 규칙을 검사하는 import-linter 계약과 서버 테스트
  team:
    - 서비스 아이디어와 시연 시나리오를 함께 기획
  collab:
    - 아이디어와 시연 흐름은 팀원들과 함께 정하고, 구현은 제가 맡아 3일 안에 끝냈습니다.
  ai:
    - Claude Code와 함께 개발했습니다. 저장소에 AI가 따를 작업 원칙 문서를 두었습니다.
    - AI가 쓴 코드는 두 가지로 확인했습니다. 레이어 방향은 import-linter 계약 2개가, 대기열과 예약 취소, 법인 안내, 고객 목록 동작은 테스트 26개가 확인합니다.
    - 상담과 지점 찾기에는 테스트가 없습니다. 화면 사이 갱신 방식도 AI 제안을 비교 없이 따랐다가 뒤에 약점으로 남았습니다.

troubles:
  - title: 세 화면에 대기열 변화를 전하는 방식을 따져 보지 않고 골랐습니다
    problem: 창구 화면과 호출 화면은 번호표가 새로 생기거나 호출될 때마다 바로 바뀌어야 합니다.
    cause: 학습 초기라 AI 코딩 도구가 제안한 폴링을 다른 방식과 비교하지 않고 그대로 따랐습니다. 폴링은 화면이 몇 초마다 서버에 새 소식이 있는지 묻는 방식입니다.
    solution: 창구 화면은 5초마다, 호출 화면은 2초마다 서버에 묻게 했습니다. 오래된 번호표를 지우는 일도 따로 두지 않고, 화면이 목록을 물어볼 때 함께 지우게 했습니다.
    detail: 3일짜리 시연이고 화면이 3개뿐이라 동작에는 문제가 없었습니다. 하지만 창구 화면은 최대 5초 늦게 바뀝니다. 화면이 늘어나면 서버로 가는 요청도 그만큼 늘어납니다. 아무 화면도 열려 있지 않으면 만료된 번호표가 지워지지 않고 남습니다.
    result: 지금 다시 만든다면 서버가 바뀐 내용을 화면에 바로 밀어 주는 방식인 SSE로 바꾸겠습니다. 만료된 번호표 정리는 화면과 상관없이 도는 별도 작업으로 떼어 내겠습니다.
    evidence:
      - { label: 창구 화면 5초 간격 확인 (teller/page.tsx), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/teller/src/app/page.tsx" }
      - { label: 호출 화면 2초 간격 확인 (display/page.tsx), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/display/src/app/page.tsx" }
      - { label: 목록을 볼 때 만료 항목 삭제 (list_queue_entries_interactor.py), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/jb/apps/queue/app/use_cases/list_queue_entries_interactor.py" }
  - title: 무료 AI 한도 때문에 시연이 멈출 수 있었습니다
    problem: 발표 도중 AI 사용 한도를 넘거나 네트워크가 끊기면 도우미가 말을 멈추고 시연 전체가 멈춥니다.
    solution: AI 호출에 폴백 체인을 두었습니다. Gemini가 실패하면 Groq를, Groq도 실패하면 미리 정해 둔 답을 씁니다. 키가 비어 있으면 네트워크에 나가 보지도 않고 바로 다음 순서로 넘어갑니다. 상담 기능은 이 순서를 모르고 답만 받습니다.
    result: 외부 키가 하나도 없어도 상담부터 호출까지 전체 흐름이 끝까지 돕니다. 다만 어느 AI가 답했는지 기록하지 않아서 나중에 확인할 수 없습니다. 예비 답은 한 문장뿐이라 키가 없으면 창구 요약 카드가 기본값으로 나갑니다.
    evidence:
      - { label: 폴백 체인 (fallback_llm_adapter.py), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/jb/core/llm/fallback_llm_adapter.py" }
      - { label: 시도 순서를 정하는 곳 (di.py), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/jb/core/di.py" }
  - title: AI가 만든 요약이 깨지거나 틀릴 때도 카드는 나가야 합니다
    problem: 창구 요약 카드는 AI가 정해진 형식으로 답해야 만들어집니다. 그런데 AI는 형식을 어기거나 엉뚱한 값을 내기도 합니다.
    solution: AI 답을 읽기 전에 답을 감싼 코드펜스를 먼저 벗겼습니다. 답 전체가 깨지면 카드 전체를 기본값으로, 한 항목만 비면 그 항목만 기본값으로 채웁니다. 법인 창구는 AI가 정확히 법인이라고 답했을 때만 고릅니다. 그래서 이상한 값이 와도 번호표 앞 글자가 틀리지 않습니다.
    detail: 요약 자체가 틀릴 수도 있습니다. 그래서 고객이 실제로 한 말만 모은 원문을 카드에 함께 붙였습니다. 직원이 요약과 원문을 나란히 보고 판단할 수 있습니다.
    result: AI 답이 어떤 모양이어도 창구에는 카드가 뜹니다. 요약이 얼마나 정확한지는 재지 않았습니다.
    evidence:
      - { label: 요약 읽기와 기본값 처리 (briefing_parser.py), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/jb/apps/chat/app/use_cases/briefing_parser.py" }
      - { label: 요약 카드를 만드는 곳 (handoff_interactor.py), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/jb/apps/chat/app/use_cases/handoff_interactor.py" }
  - title: 3일 안에 다섯 기능을 섞이지 않게 만들기
    problem: 짧은 기간에 기능을 빠르게 붙이면 요청을 받는 코드에 업무 규칙이 쌓이고, 기능끼리 서로의 속을 직접 건드리게 됩니다.
    solution: 다섯 기능을 모두 같은 세 레이어로 나누고, 레이어를 거꾸로 부르면 import-linter 검사가 실패하게 했습니다. 상담이 끝나 번호표를 만들 때도 대기열 기능의 속을 직접 부르지 않고, 포트 하나만 거치게 했습니다.
    result: import-linter 계약 2개가 모두 지켜지고 테스트 26개가 통과합니다. 대신 파일 수가 많아졌습니다. 저장소에 올린 파일은 277개입니다.
    evidence:
      - { label: import-linter 계약 (setup.cfg), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/setup.cfg" }
      - { label: 설계 문서 (ARCHITECTURE.md), url: "https://github.com/jangminseok-dev/JBAIConnect/blob/main/jb/ARCHITECTURE.md" }

retro:
  metrics:
    - { value: "5개", label: 서버 기능, note: "상담, 지점, 법인 안내, 예약, 대기열" }
    - { value: "26개", label: 서버 자동 테스트 }
    - { value: "2개", label: import-linter 계약, note: 모두 통과 }
  learned:
    - AI 도구가 제안한 방식도 한 번은 다른 방식과 견줘 봐야 한다는 것을 배웠습니다. 폴링을 그대로 따른 결과, 화면이 늘어날수록 커지는 약점이 남았습니다.
    - 시연용 서비스에서는 바깥 시스템이 모두 실패해도 흐름이 끝까지 가는 것이 먼저였습니다. Mock 어댑터와 폴백 구조 덕분에 키 없이도 전체 흐름을 보여 줄 수 있었습니다.
    - AI가 만든 결과는 틀릴 수 있다고 보고 원문을 함께 남겨야 한다는 것을 배웠습니다.
  regrets:
    - 커밋 메시지 대부분을 마침표 하나로 남겼습니다. 무엇을 왜 바꿨는지 기록이 없습니다.
    - 상담과 지점 찾기에는 테스트가 없습니다. 테스트가 대기열과 예약 쪽에 몰려 있습니다.
    - 저장소가 모두 메모리라 서버를 다시 켜면 대기열과 상담 기록이 사라집니다.
    - 고령 고객 대상 사용성 조사와 요약 정확도 평가는 하지 못했습니다.

