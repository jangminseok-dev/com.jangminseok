<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">은행 시스템 없이도 끝까지 도는 데모</text>
  <text x="40" y="100" fill="#9aa1ad" font-size="19">해커톤에는 실제 계좌 · 고객 DB · 외부 API가 없다 — 포트마다 소품(Mock)을 끼운다</text>
  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="40" y="150" width="340" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="210" y="198" fill="#fff">LlmPort</text>
    <rect x="40" y="250" width="340" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="210" y="298" fill="#fff">MapPort</text>
    <rect x="40" y="350" width="340" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="210" y="398" fill="#fff">고객 · 계좌 · 법인 안내 포트</text>
    <rect x="460" y="150" width="330" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="625" y="198" fill="#fff">Gemini → Groq</text>
    <rect x="460" y="250" width="330" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="625" y="298" fill="#fff">네이버 지역검색</text>
    <rect x="460" y="350" width="330" height="80" rx="14" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="625" y="398" fill="#9aa1ad">(실 서비스에서 교체)</text>
    <rect x="870" y="150" width="290" height="80" rx="14" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="2"/><text x="1015" y="198" fill="#fff">→ Mock (항상 성공)</text>
    <rect x="870" y="250" width="290" height="80" rx="14" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="2"/><text x="1015" y="298" fill="#fff">→ Mock</text>
    <rect x="870" y="350" width="290" height="80" rx="14" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="2"/><text x="1015" y="398" fill="#fff">Mock</text>
  </g>
  <g fill="#0ea5e9" font-size="30" text-anchor="middle"><text x="420" y="200">→</text><text x="420" y="300">→</text><text x="420" y="400">→</text></g>
  <text x="600" y="510" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">.env 를 비워 두어도 상담 → 번호표 → 창구 → 호출까지 전부 동작</text>
  <text x="600" y="550" fill="#9aa1ad" font-size="18" text-anchor="middle">실제 구현으로 바꿀 때 유스케이스 코드 변경 0 — 어댑터만 갈아 끼운다</text>
</svg>
