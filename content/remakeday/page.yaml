# 프로젝트 소개 페이지 v2, 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: AI가 연기하는 인물들과 대화하며 세계가 멸망한 이유를 찾는 추리 게임입니다. 동시에 AI가 내민 제안을 사람이 받아들이는지, 거절하는지를 기록하는 실험환경으로 설계했습니다.
  role: 5인 팀에서 AI 평가를 맡아, 어느 역할에 어떤 AI 모델을 쓸지 실험으로 정하고 결과를 숫자로 남겼습니다.
  why: AI가 제안하고 사람이 고르는 일은 점점 늘고 있지만, 그 선택을 같은 조건에서 되풀이해 관찰하기는 어렵습니다. 이 게임은 같은 하루를 다섯 번 반복하기 때문에 제안과 선택을 여러 번 기록할 수 있습니다. 원티드 AI Championship 2026 출품작입니다.
  highlights:
    - { value: "0.300 → 0.967", label: 규칙 추천 첫 순위 정확도, note: "30문장 기준, 단순 단어 비교와 임베딩 비교" }
    - { value: "0.461달러", label: 외부 API 한 판 비용, note: "기록된 호출 92회 기준, 전체는 약 0.9~1.2달러(추정)" }
    - { value: "35% → 0.6%", label: 채점관이 근거와 다른 번호를 적은 비율, note: "249건 재채점 비교, 채점 코드 수정은 팀원" }

features:
  - title: 되풀이되는 하루 속 인물과 대화
    body: 오늘이 지나면 세계가 멸망합니다. 플레이어는 다섯 번의 하루 안에 그 이유를 알아내야 합니다. 인물마다 AI가 성격과 기억을 가지고 대답하고, 플레이어는 대화로 단서를 모읍니다.
    image: media/03-1.webp
  - title: 밤마다 추리를 적어 내고 점수 받기
    body: 하루가 끝나면 모은 단서로 추리를 적어 냅니다. AI 채점관이 그 추리를 숨겨진 진실과 한 문장씩 맞춰 보고 점수를 매깁니다.
    core: true
    image: media/03-2.webp
  - title: AI에게 묻고 근거와 함께 답 받기
    body: 플레이어는 AI에게 궁금한 점을 물을 수 있습니다. AI는 플레이어가 모은 기록 안에서만 답하고, 답의 근거가 된 기록을 함께 보여 줍니다.
    image: media/06-1.webp
  - title: AI의 제안을 받거나 거절하기
    body: AI는 다음 날 세계에 걸 규칙을 제안합니다. 플레이어는 제안을 받을 수도, 거절할 수도, 직접 규칙을 쓸 수도 있습니다. 대가가 따르는 제안도 섞여 있어, 사람이 AI 제안을 어떻게 받아들이는지가 이 선택에 그대로 남습니다.
    core: true
    image: media/06-2.webp
  - title: 연구자용 판 기록 화면
    body: 연구자는 판마다 무슨 일이 있었는지 한 화면에서 확인합니다. 시간순 사건, 적용된 규칙, 채점 근거가 표로 나옵니다. 제가 만든 화면입니다.
featureNote: 게임과 별도로 연구 사이트를 운영합니다. 데이터를 모으기 전에 실험 계획을 먼저 공개했고, 사람 판을 집계한 결과와 한계도 함께 올렸습니다.

architecture:
  image: media/arch.svg
  summary: 플레이어의 대화와 선택은 서버의 게임 엔진을 거쳐 AI 역할들에게 전달됩니다. AI 모델은 LLM 어댑터만 바꾸면 로컬 모델과 외부 API 모델 사이를 오갈 수 있습니다.
  points:
    - title: 규칙은 코드가, 말과 판단은 AI가
      body: 세계가 굴러가는 규칙은 코드로 정해져 있고, AI는 인물의 말과 채점 같은 판단만 맡습니다. AI의 답은 형식 검사를 통과해야 쓰이고, 실패하면 다시 만들거나 미리 정해 둔 대체 응답을 씁니다. 이 구조는 팀원이 설계했습니다.
    - title: AI가 맡는 역할은 둘로 나눴습니다
      body: 계획, 관리, 질문 답변, 채점을 맡는 Core 역할과 인물의 대화를 맡는 NPC 역할입니다. Core가 틀리면 게임 전체가 무너지기 때문에 Core 모델을 먼저 정하고 NPC 모델을 나중에 정했습니다.
    - title: 설정값 두 개로 AI 모델을 바꿔 끼웁니다
      body: 게임 엔진은 AI에게 묻기만 하고, 어느 회사의 모델인지는 모릅니다. 그래서 설정값 두 개만 바꾸면 GPU 한 장짜리 로컬 모델과 외부 API 사이를 오갈 수 있습니다. 엔진 코드는 바꾸지 않습니다. 이 어댑터는 제가 맡았습니다.
    - title: 평가는 게임과 같은 프롬프트로
      body: 평가 러너는 게임 서버 없이 게임과 같은 프롬프트를 후보 모델에 직접 보냅니다. 그래서 모든 후보를 같은 시험으로 잴 수 있습니다. 마지막 단계인 한 판 완주 검사와 AI가 대신 플레이하는 자동 플레이만 실제 서버를 거칩니다. 결과는 실측 기록 파일에 날짜와 조건을 붙여 쌓았습니다.
  layers:
    - { name: 화면, items: [Next.js, React, TypeScript] }
    - { name: 서버, items: [Python, FastAPI] }
    - { name: AI 모델, items: [Ollama Gemma 4, Kanana 1.5, Claude API, Gemini 임베딩] }
    - { name: 데이터, items: [PostgreSQL, pgvector] }
    - { name: 평가, items: [평가 러너, metrics.yml] }
    - { name: 연구 사이트, items: [Jekyll] }

role:
  summary: 5명 중 AI 평가를 맡았습니다. 어느 역할에 어떤 AI 모델을 쓸지 실험으로 정하고, 그 결과를 숫자로 남기는 일입니다. 프로젝트 초반에는 백엔드와 AI 담당이었고, 9월 14일부터 AI 평가를 맡았습니다. 본선 발표(2026년 10월 17일 예정)에서는 모델 평가 부분과 수치 질문을 맡기로 했습니다.
  mine:
    - 평가 설계와 합격 기준 정하기
    - 후보 모델을 같은 시험으로 비교하는 평가 러너
    - Core 모델과 NPC 모델 선정 실험
    - 실측 결과를 쌓는 기록 파일 metrics.yml
    - LLM 어댑터 4종 ollama, gemini, fake, anthropic
    - 응답 지연과 GPU 메모리 같은 배포 지표 측정
    - 판 기록을 보여 주는 Inspector 화면
    - 연구 사이트의 실험 설계와 사람 판 관찰 집계
  team:
    - 전체 아키텍처와 API 계약, AI 역할별 프롬프트, AI 답을 검사하는 하네스
    - 채점 코드를 포함한 게임 엔진, Game API, 데이터베이스, 게임 화면
    - 품질 검사, 화면 자동 검사, 실행 스크립트와 배포 검증
    - 시나리오, 인물, 그림, 사운드
  collab:
    - 팀원 전원이 온프레미스 서버 한 대에 SSH로 접속해 코드를 고치고 바로 테스트했습니다. 그래서 커밋은 서버 계정 하나로 남아 있고, 개인 기여는 역할 문서를 기준으로 나눕니다.
    - 팀 역할 문서에 사람마다 맡은 영역과 대표 산출물을 적었습니다. 발표에서 누가 어떤 질문에 답할지도 이 문서로 정했습니다.
    - 모델을 고르고 바꾼 기록은 모델 평가 정본 문서 한 곳에 날짜별로 쌓았습니다. 문서에는 측정하지 않은 것은 주장하지 않는다는 원칙을 적어 두었습니다.
    - 작업 로그를 하루 단위로 남기고, 팀 개발 허브 블로그에 글로 옮겼습니다.
  ai:
    - 저장소에 AI 코딩 도구가 따를 규칙 문서를 두었습니다. 작업의 중요도에 따라 검토 강도를 세 단계로 나누고, 외부 API 어댑터와 채점 코드처럼 비용과 점수에 닿는 작업은 가장 무거운 검토를 거치게 했습니다.
    - 규칙 추천 순위를 확인하는 시험 문장 30개는 AI 에이전트가 초안을 썼습니다. 그대로 믿지 않고 팀원이 검수한 22문장으로 다시 측정해, 결과가 유지되는지 확인했습니다.

troubles:
  - title: 정답을 맞혀도 점수가 낮던 채점
    problem: 플레이테스트 8판에서 플레이어가 정답에 닿아도 점수가 21~42%에 머물렀습니다.
    cause: 플레이어의 주장 8개 가운데 유사도 상위 3개만 AI 채점관에게 넘기고 있었습니다. 정답 근거가 4위 아래로 밀리면 채점관은 그 문장을 아예 보지 못했습니다.
    solution: 골든셋의 정답형, 절반형, 오답형 답안을 게임 서버 없이 채점하는 러너를 만들어 원인을 좁혔습니다. 이어서 팀원들이 채점 방식을 고쳤습니다. 주장 8개를 모두 넘기고, 판정 기준을 글로 정하고, 채점 결과가 매번 같도록 무작위성을 없앴습니다(채점 온도 0).
    detail: 점검해 보니 문장을 비교하는 임베딩 기능은 채점에서 쓰이지 않게 됐습니다. 그래서 틀려도 플레이어가 다시 고르면 되는 규칙 추천 순위 한 자리에만 되살렸습니다. 30문장 비교에서 첫 번째 추천이 맞은 비율은 단순 단어 비교 0.300, 임베딩 0.967이었습니다.
    result: 세 변경을 함께 적용한 결과 정답형 점수는 65.3점에서 100점이 되었고, 오답형 점수는 25.7점에서 19.4점으로 내려갔습니다. 두 번 반복해도 점수 차이는 없었습니다. 다만 이 점수는 골든셋 답안으로 측정한 값이고, 실제 플레이에서는 점수가 훨씬 낮게 나왔습니다. 리뷰에서 골든셋 답안이 정답 문장의 낱말을 그대로 쓴 글이어서, 사람이 자기 말로 쓴 답과 달랐다는 원인을 찾았습니다.
    evidence:
      - { label: 채점 캘리브레이션 러너 (run_scoring_calibration.py), url: "https://github.com/remakeday/com.remakeday/blob/main/backend/scripts/run_scoring_calibration.py" }
      - { label: 규칙 추천 순위 비교 러너 (run_rule_alternatives_eval.py), url: "https://github.com/remakeday/com.remakeday/blob/main/backend/scripts/run_rule_alternatives_eval.py" }
      - { label: 모델 평가 정본 (model_evaluation.md), url: "https://github.com/remakeday/com.remakeday/blob/main/docs/model_evaluation.md" }
  - title: 이유는 맞게 쓰고 번호만 틀린 채점관
    problem: 한 참가자의 결과 화면에서 그 참가자의 주장이 엉뚱한 문장으로 표시됐습니다. 기록을 보니 채점관은 이유 설명에서 2번 후보를 정확히 인용하고도 번호는 1로 적었습니다. 이 번호로 인정된 문장을 다음 회차에 고정하기 때문에 단순한 표시 오류가 아니었습니다.
    cause: 9월 9일부터 17일까지 저장된 채점 249건을 모두 살폈습니다. 인용이 있는 181건 중 38건이 인용과 다른 번호였고, 38건 모두 인용한 번호보다 하나 작았습니다.
    solution: 다시 시도하게 하는 방법은 쓰지 않았습니다. 채점 결과가 매번 같도록 설정해 두어서 같은 실수가 반복되기 때문입니다. 대신 근거 문장을 번호보다 먼저 옮겨 적게 하고, 그 문장이 정확히 한 후보와 일치하면 그 후보의 번호를 쓰도록 했습니다. 저는 전수 조사와 옛 방식, 새 방식의 재채점 비교를 맡았고, 채점 코드 수정은 팀원이 했습니다.
    detail: 같은 249건을 두 방식으로 다시 채점해 판정이 흔들리지 않는지도 확인했습니다. 판정은 249건 중 230건이 같았습니다. 인용이 후보와 조금 달라 원래 번호로 돌아가는 11건은 한계로 남았습니다.
    result: 같은 249건을 다시 채점한 비교에서 번호 오류는 옛 방식이 162건 중 56건(35%), 새 방식이 163건 중 1건(0.6%)이었습니다.
    evidence:
      - { label: 모델 평가 정본의 인용 보정 기록 (model_evaluation.md), url: "https://github.com/remakeday/com.remakeday/blob/main/docs/model_evaluation.md" }
  - title: GPU 한 장에 두 모델 함께 올리기
    problem: 16GB GPU 한 장에 Core 모델과 NPC 모델이 동시에 올라가야 했습니다. 성능이 좋아도 함께 올라가지 못하면 쓸 수 없었습니다.
    cause: 처음에는 모델 파일 크기로 필요한 메모리를 추정했습니다. 그런데 한 후보는 파일이 8.95 GiB인데 실제로는 3.06 GiB만 차지해, 추정이 크게 빗나갔습니다.
    solution: 이후로는 실제로 올려서 측정한 값으로만 판단했습니다. NPC 모델을 먼저 올린 뒤 Core 후보를 올리고, 두 모델에 번갈아 요청을 보내며 요청마다 메모리 상태를 기록했습니다. 한 모델이 밀려나거나 일부가 CPU로 넘어가는지 확인하는 방식입니다. 형식 준수, 정답 누설, 응답 지연, 두 모델이 함께 올라가는지, 한 판 완주를 합격선으로 먼저 정하고 모든 후보를 같은 조건으로 걸렀습니다.
    result: 채택한 Core 모델과 Kanana NPC 모델 조합은 두 모델 합계 12.42 GiB, GPU 메모리 전체 사용량 최고 13,402 / 16,311 MiB였고, 번갈아 요청을 보낸 구간에서 밀려난 모델은 없었습니다. 다만 세 번씩 번갈아 보낸 짧은 측정이고, 여러 사람이 동시에 접속하는 부하는 아직 측정 전입니다.
    evidence:
      - { label: Core 선정 러너 (run_core_selection.py), url: "https://github.com/remakeday/com.remakeday/blob/main/backend/scripts/run_core_selection.py" }
      - { label: 실측 기록 (metrics.yml), url: "https://github.com/remakeday/com.remakeday/blob/main/docs/metrics.yml" }
  - title: 심사 기간을 버티려고 외부 API로 옮기기
    problem: 로컬 서버는 집 회선, 정전, 재부팅이 곧 서비스 장애였습니다. 심사 기간에는 언제든 접속되는 서비스여야 했습니다.
    solution: 게임 엔진은 그대로 두고 LLM 어댑터만 바꿔 끼우도록 Anthropic 어댑터를 붙였습니다. 설정값 두 개로 로컬과 외부를 오가고, 문제가 생기면 같은 방법으로 되돌립니다.
    detail: 붙이는 과정에서 문제가 셋 나왔습니다. 라이브러리 버전 차이로 한 모델에 설정값을 보내는 인자가 사라져 호출이 실패했고, 다른 경로로 보내도록 고쳤습니다. 외부 API가 목록 최대 개수를 지키지 않아 계획을 다시 만드는 일이 생겼고, 엔진 쪽에서 앞부분만 남기도록 잘라 막았습니다. 응답 지연 합격 여부는 1회 측정과 3회 측정에서 결과가 뒤집혀, 지연은 합격으로 적지 않고 예외로 기록한 채 채택했습니다.
    result: 엔진과 채점 코드를 바꾸지 않고 전환했습니다. 한 판 비용은 기록된 호출 92회를 실제 토큰 수로 세어 0.461달러였고, 기록에서 빠진 인물 대화까지 환산하면 약 0.9~1.2달러(추정)입니다.
    evidence:
      - { label: Anthropic 어댑터 (anthropic_llm.py), url: "https://github.com/remakeday/com.remakeday/blob/main/backend/apps/engine/adapter/outbound/llm/anthropic_llm.py" }
      - { label: 설정으로 어댑터를 고르는 코드 (llm_factory.py), url: "https://github.com/remakeday/com.remakeday/blob/main/backend/apps/engine/dependencies/llm_factory.py" }

retro:
  metrics:
    - { value: "0.461달러", label: 외부 API 한 판 비용, note: "기록된 호출 92회 기준, 전체는 약 0.9~1.2달러(추정)" }
    - { value: "0건", label: 인물 대화 실패, note: "41문답, 9월 15일 Gemma 검사" }
    - { value: "12.42 GiB", label: 함께 올린 두 모델의 GPU 메모리 합계, note: "16GB GPU 한 장, 번갈아 요청한 구간에서 밀려난 모델 없음" }
    - { value: "80%", label: 적용된 규칙 중 AI 제안에서 나온 비율, note: "사람 판 14판, 60건 중 48건, 탐색적 집계" }
  learned:
    - 합격선을 먼저 정하고 모든 후보를 같은 시험으로 평가하면, 결과를 보고 기준을 바꿨다는 의심을 받지 않습니다.
    - 검색은 후보가 많을 때 쓰는 도구입니다. 후보가 8개뿐인 채점에서는 검색이 오히려 정답을 떨어뜨렸습니다. 기술을 넣을 자리는 측정해 보고 정해야 한다는 것을 배웠습니다.
    - 사람 판 14판으로는 AI 제안이 사람을 바꾼다고 말할 수 없습니다. 그래서 비율을 탐색적 집계로만 적고, 실험 계획을 먼저 공개하는 쪽을 택했습니다.
  regrets:
    - 첫 번째 합격선에는 대화의 뜻을 평가하는 기준이 없어 NPC의 말투와 논리를 좁게만 봤습니다. 이후 질문 이해와 당일 기억을 보는 대화 검사를 따로 만들었고, 다음에는 처음부터 의미 기준을 합격선에 넣겠습니다.
    - 사전에 공개한 본 실험은 아직 실행 전입니다. 다음 단계는 AI 제안에 이유를 붙인 조건과 붙이지 않은 조건을 무작위로 나눠, 제안을 받아들이는 비율을 비교하는 것입니다.
    - 외부 API 호출에 프롬프트 캐시를 아직 쓰지 않았습니다. 인물 대화마다 같은 안내문이 반복되므로, 제출 뒤 가장 먼저 캐시를 넣어 비용을 줄일 계획입니다(측정 전).

