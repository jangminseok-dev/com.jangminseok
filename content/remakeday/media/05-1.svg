<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">.env 두 줄로 로컬 ↔ 외부 API 전환</text>
  <text x="40" y="100" fill="#9aa1ad" font-size="19">심사 기간의 동시 접속과 가용성 — 엔진 코드는 한 줄도 바꾸지 않는다</text>
  <g font-size="21" font-weight="700" text-anchor="middle">
    <rect x="40" y="170" width="300" height="140" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
    <text x="190" y="230" fill="#fff">게임 엔진</text><text x="190" y="265" fill="#9aa1ad" font-size="17" font-weight="400">추리, 채점, NPC</text>
    <rect x="440" y="170" width="300" height="140" rx="18" fill="#0f1115" stroke="#a855f7" stroke-width="2"/>
    <text x="590" y="230" fill="#fff">LLM 포트</text><text x="590" y="265" fill="#9aa1ad" font-size="17" font-weight="400">provider 어댑터</text>
    <rect x="840" y="150" width="320" height="80" rx="16" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="1000" y="198" fill="#fff" font-size="19">로컬 Ollama (GPU 1장)</text>
    <rect x="840" y="250" width="320" height="80" rx="16" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/><text x="1000" y="298" fill="#fff" font-size="19">외부 API (Claude)</text>
  </g>
  <g fill="#a855f7" font-size="36" text-anchor="middle"><text x="390" y="250">→</text><text x="790" y="215">↗</text><text x="790" y="305">↘</text></g>
  <rect x="40" y="390" width="1120" height="110" rx="18" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <text x="80" y="435" fill="#fff" font-size="21" font-weight="700">클라우드 GPU는 기각 — 45일에 약 1,100~1,600달러 (추정)</text>
  <text x="80" y="472" fill="#9aa1ad" font-size="18">외부 API 판당 비용은 토큰 계수로 실측 — 92회 호출, 0.461달러</text>
  <g font-size="44" font-weight="700" fill="#a855f7" text-anchor="middle"><text x="600" y="590">$0.461</text></g>
  <text x="600" y="630" fill="#9aa1ad" font-size="18" text-anchor="middle">한 판당 실측 비용</text>
</svg>
