<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif"><rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">GPU 16GB 한 장에 두 모델이 같이 앉을 수 있는가</text>
  <text x="40" y="100" fill="#9aa1ad" font-size="19">"누가 더 똑똑한가" 보다 "같이 상주할 수 있는가" 부터 — 합격선을 먼저 정한다</text>
  <rect x="40" y="150" width="1120" height="90" rx="16" fill="#0f1115" stroke="#2a2f3a" stroke-width="2"/>
  <rect x="40" y="150" width="915" height="90" rx="16" fill="#a855f7" fill-opacity="0.35"/>
  <text x="70" y="205" fill="#fff" font-size="22" font-weight="700">Core + NPC 동시 상주 12.34 GiB</text>
  <text x="1130" y="205" fill="#9aa1ad" font-size="19" text-anchor="end">GPU 사용 81.7%</text>
  <text x="40" y="310" fill="#fff" font-size="22" font-weight="700">결정적 게이트 — 모든 후보를 같은 시험으로</text>
  <g font-size="19" text-anchor="middle" font-weight="700">
    <rect x="40" y="340" width="210" height="80" rx="14" fill="#0f1115" stroke="#a855f7" stroke-width="2"/><text x="145" y="388" fill="#fff">스키마 준수</text>
    <rect x="267" y="340" width="210" height="80" rx="14" fill="#0f1115" stroke="#a855f7" stroke-width="2"/><text x="372" y="388" fill="#fff">누설 0</text>
    <rect x="494" y="340" width="210" height="80" rx="14" fill="#0f1115" stroke="#a855f7" stroke-width="2"/><text x="599" y="388" fill="#fff">지연 p95</text>
    <rect x="721" y="340" width="210" height="80" rx="14" fill="#0f1115" stroke="#a855f7" stroke-width="2"/><text x="826" y="388" fill="#fff">동시 상주</text>
    <rect x="948" y="340" width="212" height="80" rx="14" fill="#0f1115" stroke="#a855f7" stroke-width="2"/><text x="1054" y="388" fill="#fff">루프 완주</text>
  </g>
  <text x="40" y="500" fill="#fff" font-size="22" font-weight="700">순서: Core(E7) → NPC(E6)</text>
  <text x="40" y="540" fill="#9aa1ad" font-size="19">추리, 채점을 맡는 Core가 실패하면 게임 전체가 무너진다 — 실패 비용이 큰 쪽을 먼저 확정</text>
  <text x="40" y="590" fill="#9aa1ad" font-size="19">NPC 대화 41문답 실패 0, 중간값 2.599초</text>
</svg>
