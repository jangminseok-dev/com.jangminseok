# 프로젝트 소개 페이지 v2: 한눈에 보기, 주요 기능, 아키텍처, 맡은 일, 어려웠던 점, 회고
# 기본 정보(제목, 기간, 팀, 스택, 링크)는 project.yaml을 그대로 쓴다.

overview:
  what: 서울에서 창업할 곳을 찾는 사람과 주식 투자자가 질문을 입력하면, 서울시 상권 공공데이터와 주가, 뉴스를 근거로 답해 주는 대화형 서비스입니다.
  role: 혼자서 서버, 화면, AI 품질 평가, 배포까지 모두 맡았습니다.
  why: 작은 AI 모델을 직접 운영하면서도 틀린 답을 내보내지 않는 것이 목표입니다. 숫자와 금지 표현은 AI가 아니라 코드가 확인하고, 품질은 바꿀 때마다 정답을 정해 둔 평가 문항인 골든셋으로 잽니다.
  highlights:
    - { value: "62초 → 1.5초", label: 조건 질의 응답 시간, note: "\"유동인구 많고 폐업률 낮은 상권 3곳\" 같은 질문, 이전에는 62초 뒤 오류" }
    - { value: "0.743 → 0.878", label: 검색 품질 점수(nDCG@5), note: "상권과 종목 질문 40개, 검색 모델 교체 전과 후" }
    - { value: "2.2ms → 0.065ms", label: 상권 최신 자료 조회, note: 인덱스를 다시 설계하기 전과 후 }

features:
  - title: 대화로 묻는 상권 분석
    body: "\"성수동 카페 상권 어때요?\"처럼 물으면 서울시 상권 데이터에서 매출, 유동인구, 폐업률을 찾아 답합니다. 숫자가 들어간 문장에는 어느 자료에서 왔는지 근거 번호를 붙입니다. 점수가 낮은 상권이면 첫 문단에서 주의 등급임을 먼저 알립니다."
    core: true
    image: media/f-ask.webp
  - title: 상권 지도
    body: 서울 지도에서 상권을 살피고 옆 대화창에서 바로 물어볼 수 있습니다. 상권 상세 화면에서는 종합점수와 등급을 볼 수 있습니다.
    image: media/03-2.webp
  - title: 창업 자금 계산
    body: "\"성수동에 카페, 내 돈 1억이면 몇 개월 버티나\"처럼 물으면 몇 달을 버틸 수 있고 얼마가 모자라는지 계산해 줍니다. 임대료는 한국부동산원, 금리는 한국은행 자료를 씁니다. 계산은 코드가 하고, AI는 그 결과를 풀어 설명합니다."
    image: media/f-fund.webp
  - title: 종목 분석과 신호 보드
    body: 한국과 미국 종목을 물으면 시세, 지표, 뉴스를 모아 설명합니다. 신호 보드는 종목마다 앞으로 5거래일의 상승 또는 하락 신호와 지난 적중률을 함께 보여 줍니다. 보드 아래에는 매매 지시가 아니라는 안내를 붙였습니다.
    core: true
    image: media/03-3.webp
  - title: 가격 도달과 뉴스 알림
    body: 사용자가 직접 정한 가격에 종목이 닿거나, 관심 종목에 강한 뉴스가 나오면 이메일이나 텔레그램으로 알려 줍니다. 서버가 매시간 자동으로 확인합니다.
    image: media/f-alert.webp
  - title: AI 모의투자
    body: AI 계정과 지표 규칙 계정이 각각 가상의 1억 원으로 실제 종목을 매일 사고팔고, 그 기록을 공개합니다. 7월 30일부터 30거래일치를 지난 시세로 돌려 본 결과 AI는 0.94억 원, 지표 규칙 계정은 1.07억 원이 되었습니다. AI가 진 기록도 그대로 보여 줍니다.
    image: media/f-paper.webp
featureNote: 주식 정보는 늦게 들어오는 시세를 쓰는 참고 정보이며, 매매를 권하지 않습니다.

architecture:
  image: media/arch.svg
  summary: 질문은 화면에서 서버로 들어옵니다. 서버는 질문 종류에 맞는 데이터를 모아 AI에게 문장을 쓰게 합니다. 답을 내보내기 전에 코드로 만든 규칙 가드가 숫자와 금지 표현을 한 번 더 확인합니다.
  points:
    - title: 규칙은 AI가 아니라 코드가 지킵니다
      body: 작은 AI 모델은 프롬프트에 적어 둔 규칙도 어겼습니다. 그래서 없는 데이터를 "없다"고 먼저 밝히는 일, 조건에 맞는 상권을 정렬하는 일, 주의 등급 상권에 추천 표현을 쓰지 않는 일은 코드가 맡습니다. AI는 그 결과를 문장으로 풀어 씁니다.
    - title: 앱끼리는 허브 모듈을 거쳐서만 통신합니다
      body: 서버는 상권, 주식, 대화, 인증 등 8개 앱으로 나뉩니다. 앱끼리는 서로를 직접 부르지 못하고, 허브 모듈을 거쳐야 합니다. 혼자 만드는 큰 서버가 엉키지 않도록, 이 규칙을 import-linter라는 검사 도구의 계약 5개로 확인합니다.
    - title: 서버는 k3s에, 데이터는 제자리에
      body: k3s는 여러 서비스를 한곳에서 띄우고 관리해 주는 가벼운 쿠버네티스입니다. 규모를 키우려는 것이 아니라, 배포와 정기 작업, 재시작을 한곳에서 보고 관리하려고 도입했습니다. 데이터베이스는 나중에 클라우드로 옮길 예정이라 기존 Docker Compose에 그대로 두었습니다. 데이터를 두 번 옮기지 않기 위해서입니다. 서버를 이미지로 만들어 AWS EC2에서 돌아가는 것도 확인했습니다. 다만 계속 올려 두면 비용이 나가서 교육 과정 동안은 자체 서버로 운영하고, 과정이 끝나면 AWS를 다시 검토합니다. 이미지 저장에는 AWS S3를 연결했습니다.
    - title: AI 모델은 직접 돌리고, 외부 AI는 보조로만
      body: 상권과 주식 답변은 8GB GPU에서 도는 로컬 모델이 씁니다. 서비스 주제를 벗어난 일반 질문과 예비용으로만 외부 AI인 Gemini를 부릅니다.
  layers:
    - { name: 화면, items: [Next.js 16, React 19, TypeScript, Tailwind 4] }
    - { name: 서버, items: [Python 3.13, FastAPI, SQLAlchemy 2, import-linter] }
    - { name: 데이터, items: [PostgreSQL + pgvector, Redis, 서울 열린데이터광장] }
    - { name: AI, items: [Ollama, Gemma 4, embeddinggemma, Gemini, LangChain, PyTorch] }
    - { name: 배포, items: [k3s, Docker Compose, Cloudflare Tunnel, Vercel, "AWS (EC2 시험 배포, S3)"] }

role:
  summary: 1인 프로젝트로, 기획부터 서버, 화면, AI 품질 평가, 배포와 운영까지 모두 직접 했습니다. 저장소에 남은 커밋은 451개입니다.
  mine:
    - 서버 구조 설계와 앱 사이 의존을 막는 import-linter 계약 5개
    - 질문 종류를 가려 상권과 주식 데이터로 답하는 대화 흐름과 규칙 가드
    - 서울시 상권 공공데이터 적재, 상권 종합점수, 창업 자금 계산
    - AI 답변 골든셋 평가와 검색 품질 채점 도구
    - Next.js 웹 화면
    - 자체 서버 배포와 데이터 수집 등 k3s 정기 작업 11개
  collab:
    - 로드맵 문서에 작업 단위마다 완료 기준과 검증 결과를 함께 적었습니다.
    - 도입하지 않기로 한 실험도 측정값과 판정 이유를 평가 문서에 남겼고, 평가 방법의 한계도 같은 문서에 밝혀 두었습니다.
    - 주요 결정과 문제 해결 과정은 블로그에 글로 정리했습니다.
  ai:
    - Claude Code와 함께 개발했습니다. 저장소에 AI가 따를 규칙 문서를 두어 폴더 경계, 검증 절차, 작업 범위를 정했습니다.
    - AI가 쓴 코드는 세 가지로 검증했습니다. 앱 사이 규칙은 import-linter가, 기능은 백엔드 테스트가, 답변 품질은 골든셋 평가가 확인합니다.
    - CI는 Claude Code와 논의한 끝에 1인 개발 단계에서는 로컬 수동 검증으로 충분하다고 보고 껐습니다. 수동 실행을 빠뜨리면 놓칠 수 있어서, 이후 이 포트폴리오 저장소에서는 CI 검사를 통과해야 합치도록 했습니다.

troubles:
  - title: 작은 AI 모델이 프롬프트의 규칙을 어겼습니다
    problem: 테스트 계정으로 초보자, 전문가, 손실 중인 투자자 역할을 맡아 질문해 보니 틀린 답이 나왔습니다. 점수가 서울 평균에 못 미치는 주의 등급 상권을 "강력히 추천"했습니다. 조건을 단 질문은 62초 뒤 오류 문구가 그대로 화면에 나왔습니다.
    cause: 모델이 "50점이 서울 평균"이라는 점수의 뜻을 모른 채 숫자를 자유롭게 서술했습니다. 규칙은 이미 프롬프트에 다 적혀 있었습니다.
    solution: 프롬프트 문구를 더 쓰지 않고 코드가 집행하게 바꿨습니다. 점수마다 "서울 평균 미달" 같은 뜻풀이 문장을 코드가 넣습니다. 주의 등급이면 추천 표현을 바꾸고 등급 안내를 첫 문단에 붙입니다. 조건을 단 질문은 AI를 거치지 않고 코드가 순위를 정렬해 답합니다.
    detail: 가드와 품질 채점기는 같은 판정 규칙을 씁니다. 가드를 통과한 답이 채점에서 떨어지면 둘이 어긋났다는 신호로 볼 수 있습니다.
    result: 조건을 단 질문이 62초 뒤 오류에서 1.5초 만의 정답으로 바뀌었습니다.
  - title: 안전장치가 고장을 가렸습니다
    problem: 상권 선택 단계에 쓰는 프롬프트에 열 하나를 더하자, AI가 상권 코드를 한 건도 돌려주지 못했습니다. 40건 중 40건 성공하던 것이 44건 중 0건이 되었습니다. 그런데 지역 적중률 지표는 1.0으로 정상처럼 보여 지표만으로는 드러나지 않았습니다.
    cause: 프롬프트가 4,042토큰에서 4,178토큰으로 늘었는데, Ollama의 기본 컨텍스트 창이 4,096토큰이었습니다. 넘친 부분이 앞에서부터 잘리면서 맨 앞의 답변 형식 지시가 사라졌습니다. 지역 이름을 맞춰 주는 가드가 틀린 결과를 보정해서 지표에는 드러나지 않았습니다.
    solution: 컨텍스트 창을 8,192토큰으로 명시했습니다. 실제로 처리한 토큰 수가 한도에 가까워지면 경고를 남기게 했습니다. 이 조건은 회귀 테스트로 고정했고, AI 서버 상태를 매일 점검하는 스크립트도 새로 돌렸습니다.
    result: 같은 프롬프트가 잘리지 않고 모두 들어가 정상 형식의 답이 돌아왔습니다. 결과 지표만 봐서는 가드 뒤의 실패가 보이지 않는다는 것을 배웠습니다.
  - title: 라이선스 때문에 AI 모델을 바꿔야 했습니다
    problem: 답변을 쓰던 모델 EXAONE 3.5가 연구 전용 라이선스여서 공개 서비스 전에 바꿔야 했습니다. 모델을 바꿨을 때 품질이 떨어졌는지 확인할 방법이 필요했습니다.
    solution: 정답과 채점 기준을 정해 둔 골든셋을 만들었습니다. 실제 모델로 답을 받아 기록하는 단계와, 그 기록을 규칙으로 채점하는 단계를 나눴습니다. 채점은 AI가 아니라 규칙이 하므로 같은 기록은 언제나 같은 점수를 받습니다. 후보 모델은 8GB GPU에 올라가는 크기로 한정해 같은 시험을 치게 했습니다.
    detail: Llama 3.1 8B는 자료에 없는 지하철 노선을 지어냈고, Kanana 1.5 8B는 지시를 잘 따르지 않았습니다. Gemma 4는 지어낸 숫자, 잘린 답, 절대 규칙 위반이 모두 0건이어서 골랐습니다. 기준선은 가장 좋은 기록이 아니라 여러 번 돌려 나온 가장 낮은 값으로 잡았습니다. 같은 조건에서도 점수가 흔들려서, 최고 기록을 기준으로 삼으면 평소 수준의 실행도 실패로 떨어지기 때문입니다.
    result: 교체 뒤 골든셋 144문항에서 오류가 0건이었습니다. 숫자가 들어간 문장 중 근거 번호가 달린 비율은 0.987이었습니다.
  - title: 좋아 보이던 검색 기법을 재 보고 넣지 않았습니다
    problem: 벡터 검색과 키워드 검색을 섞는 하이브리드 검색을 쓰면 더 정확해질 것 같았습니다. 하지만 검색 품질을 잴 지표가 없었습니다.
    solution: 검색 골든셋 40문항을 만들고, 검색 결과 1,120건에 관련도 라벨을 달아 채점 도구를 만들었습니다. 점수가 0.03 이상 오를 때만 도입하기로 기준을 먼저 정했습니다.
    detail: 하이브리드 방식은 0.765에서 0.783으로 0.018 오르는 데 그쳐 기준에 못 미쳤습니다. 주식 질문은 좋아지고 상권 질문은 나빠져 방향도 엇갈렸습니다. 나중에 검색 모델을 바꾸자 점수가 급락한 것처럼 보였는데, 새 모델이 찾은 문서 중 58%에 관련도 라벨이 없었기 때문입니다. 707건을 더 채점한 뒤 다시 비교했습니다.
    result: 하이브리드 방식은 기준 미달로 기각했습니다. 라벨을 더 붙인 뒤 다시 채점하니 기존 검색 모델은 0.743, 새 검색 모델은 0.878이었고, 이때는 하이브리드 방식이 오히려 0.055 낮아 "검색 모델이 약할 때만 이득"으로 결론을 고쳤습니다.
  - title: LangGraph와 QLoRA를 검토하고 넣지 않았습니다
    problem: 여러 단계를 거쳐 답해야 하는 비교 질문에는 LangGraph가, 답변 품질을 올리는 데는 QLoRA 파인튜닝이 도움이 될 것 같았습니다. 하지만 GPU가 8GB 한 장이고 한 번에 한 질문만 생성할 수 있어서 AI 호출이 늘면 그만큼 다음 사람의 대기 시간이 늘어납니다.
    solution: 새 기술은 네 가지를 확인한 뒤에 넣기로 정했습니다. 이 기술이 없으면 하기 어려운 작업이 실제로 있는지, 도입 범위를 최소로 좁혔는지, 지연과 메모리를 측정했는지, 나중에 뺄 방법이 있는지입니다. LangGraph는 비교 질문 전용 경로로 설계 문서까지 썼습니다. 코드를 쓰기 전에 그때까지 쌓인 질문 129건을 모두 분류해, 여러 단계를 거쳐야만 답할 수 있는 질문이 실제로 있는지 확인했습니다. QLoRA는 당시 모델인 EXAONE에 맞춘 학습 호환 패치를 만들어 학습이 실행되는 것까지 확인했습니다. 이때 GPU 메모리 사용량은 8GB 중 7.69GiB였습니다.
    result: 그런 질문은 129건 중 0건이었습니다. 그래서 LangGraph 경로와 그 뒤에 붙일 그래프 검색을 함께 보류했습니다. QLoRA는 EXAONE이 연구 전용 라이선스라 곧 바꿔야 할 모델이었고 학습에 쓸 데이터도 부족해서 멈췄습니다. 그 시간은 코드 가드와 골든셋 평가, 작은 분류 모델 학습에 썼습니다.

retro:
  metrics:
    - { value: "0.987", label: 근거 번호가 달린 비율, note: "골든셋 144문항, 숫자가 들어간 답변 문장 기준" }
    - { value: "1.5초", label: 조건 질의 응답 시간, note: 이전에는 62초 뒤 오류 }
    - { value: "0.065ms", label: 상권 최신 자료 조회, note: 인덱스를 다시 설계하기 전에는 2.2ms }
    - { value: "451개", label: 커밋 }
  learned:
    - AI에게 규칙을 부탁하는 것보다 코드가 지키게 하는 쪽이 확실했습니다. AI는 문장을 쓰고, 숫자와 금지 표현은 코드가 확인하도록 나눴습니다.
    - 안전장치도 감시해야 합니다. 결과 지표만 보면 안전장치 뒤에 숨은 고장을 놓친다는 것을 사고로 배웠습니다.
    - 좋아 보이는 기법도 재 보기 전에는 넣지 않았습니다. 기각한 기록이 남아 있어서 조건이 바뀌었을 때 결론을 고칠 수 있었습니다.
  regrets:
    - 가드가 얼마나 자주 개입했는지 감시하는 지표를 처음부터 두지 못했습니다. 다음에는 안전장치의 개입 횟수를 결과 지표와 함께 보겠습니다.
    - 검색 정답표는 사람이 아니라 외부 AI가 붙였고, 사람이 직접 확인한 표본은 없습니다. 다음에는 일부를 사람이 직접 확인해 AI가 붙인 라벨과 맞춰 보겠습니다.

