slides:
  - title: 설계 원칙 - 기계가 검사하는 아키텍처
    label: 자동 검사되는 아키텍처 (import-linter)
    summary: 혼자 만드는 모놀리식에서 앱 8개가 엉키지 않도록, 구조 규칙을 문서가 아니라 자동 검사 계약으로 만들었습니다.
    stats:
      problem: 1인 모놀리식에서 앱 8개가 서로를 직접 참조하며 엉킬 위험이 있었습니다. CI도 두지 않기로 해 사람의 리뷰에 기댈 수 없었습니다
      choice: 앱 내부는 헥사고날(adapter → app → domain), 앱 사이는 허브-스포크입니다. import-linter 계약 5종으로 강제했습니다
      cost: 스포크끼리 협력할 때마다 허브에 포트를 새로 만들어야 합니다 (예 — StockStatusPort 신설)
      effect: 구조 위반이 리뷰가 아니라 검사 실패로 드러납니다. 기록된 결과는 "계약 5 KEPT"입니다
    frames:
      - { image: media/02-1.svg, caption: 허브-스포크와 헥사고날 레이어 (도식) }
    alternatives:
      - { name: 마이크로서비스 분리 + 메시지 브로커, reason: 1인 규모에서 운영 부담만 늘어나는 과설계로 판단해 로드맵의 비추천 목록에 명시했습니다 }
    concept:
      title: import-linter 계약이란?
      body: 건물 도면에 "이 층에서 저 층으로 배관을 바로 잇지 말 것"을 적어 두고 공사 중 자동 검사기가 위반을 찾아 경보를 울리는 것과 같습니다. 규칙을 사람의 기억이 아니라 도구가 지킵니다.
    evidence:
      - { label: minseok/.importlinter — 계약 5종 }
      - { label: "ROADMAP — 계약 5 KEPT, 과설계 목록" }
    proves: [python-backend]

  - title: 결정론 가드 - 규칙은 프롬프트가 아니라 코드가 지킵니다
    label: LLM 오답 방지 코드 가드
    summary: 소형 모델은 프롬프트에 적힌 규칙도 어겼습니다. 그래서 숫자와 금지 사항은 코드가 집행하고, 모델은 문장만 쓰게 했습니다.
    stats:
      problem: 7.8B 모델이 '주의' 등급 상권을 "강력히 추천"하는 등 프롬프트에 이미 있는 규칙을 어겼습니다
      choice: 없는 데이터는 코드가 첫 문장에 "없다"고 넣고 조건 질의의 정렬도 코드가 합니다
      cost: 가드 코드가 늘고 가드가 실패를 가린 사고가 있었습니다 — 컨텍스트 초과로 답변이 전부 죽었는데 지표는 정상으로 보여 4일간 탐지하지 못했습니다
      effect: 조건 질의 62초 오류 → 1.5초 정답입니다
    frames:
      - { image: media/03-1.webp, caption: 질문 홈 — 근거 데이터를 밝히는 안내 }
      - { image: media/03-2.webp, caption: 상권 지도와 대화 패널 }
      - { image: media/03-3.webp, caption: 신호 보드 — 적중률과 "매매 지시 아님" 고지 }
    alternatives:
      - { name: 프롬프트 문구 보강, reason: 규칙은 이미 프롬프트에 다 있었습니다 — 문구를 더 쓰는 것으로는 막지 못했습니다 }
      - { name: 더 큰 모델, reason: 8GB VRAM 제약으로 12B급은 후보에서 제외했습니다 }
    concept:
      title: 결정론 가드란?
      body: 신입 직원에게 매번 말로 당부하는 대신, 결재 시스템에 "이 조건이면 자동 반려"를 걸어 두는 방식입니다. AI는 문장을 쓰고, 숫자와 금지 사항은 프로그램이 최종 확인합니다.
    evidence:
      - { label: 블로그 — 결정론 가드 }
      - { label: ROADMAP — num_ctx 사고 기록 }
    proves: [rag]

  - title: 골든셋 회귀 평가 - LLM 품질을 시험으로 관리
    label: LLM 품질 회귀 테스트 (골든셋)
    summary: 프롬프트나 모델을 바꿀 때마다 같은 시험을 다시 치고 규칙으로 채점합니다. 라이선스 문제로 모델을 교체할 때도 이 시험을 통과한 뒤에만 투입했습니다.
    stats:
      problem: 프롬프트나 모델을 바꿔도 품질이 떨어졌는지 알 수 없었습니다. 이후 생성 모델(EXAONE)이 출력물 상용 금지 라이선스로 드러나 교체가 필요했습니다
      choice: 러너(실제 LLM 실행)와 게이트(커밋된 trace를 규칙으로 채점)를 분리했습니다. baseline은 최고 기록이 아니라 바닥입니다
      cost: 유용함 같은 주관적 품질은 재지 못합니다. 러너 1회 15~27분입니다
      effect: 모델 교체 후 골든셋 144문항 오류 0, 인용률 0.987입니다
    frames:
      - { image: media/04-1.svg, caption: 러너 → trace → 게이트 (도식) }
    alternatives:
      - { name: LLM-as-judge, reason: 단일 모델 정책에서 같은 모델이 자기 답을 채점하는 순환 평가가 됩니다 }
      - { name: Llama 3.1 8B와 Kanana, reason: 같은 골든셋에서 각각 지하철 노선을 지어내고 지시 준수가 약해 탈락했습니다 }
    concept:
      title: 골든셋이란?
      body: 정답과 채점 기준이 정해진 시험 문제 모음입니다. AI를 고칠 때마다 같은 시험을 다시 치게 하고 점수가 기준선 아래로 내려가면 변경을 반려합니다. 채점은 AI가 아니라 규칙이 합니다.
    evidence:
      - { label: chat/_docs/EVAL.md — 러너와 게이트 분리 }
      - { label: LLM_SWAP_EVAL — 후보 5종 비교 }
    proves: [rag]

  - title: 하이브리드 검색 - 측정하고 기각했습니다
    label: 하이브리드 검색 측정 후 미채택
    summary: 벡터와 키워드를 섞으면 좋아질 것 같았지만 재 보니 개선이 기준에 못 미쳐 도입하지 않았습니다. 측정해서 기각한 기록 자체가 결과물입니다.
    stats:
      problem: 검색 품질 지표가 전혀 없었고 한국어 형태소 분석 확장(pg_bigm, PGroonga)도 없었습니다
      choice: TREC pooling 골든셋 40문항 + nDCG, MRR 채점기를 만들고 trigram+벡터 RRF를 채택 게이트(+0.03)로 판정했습니다
      cost: 라벨 풀링 편향 — 모델을 바꾸자 새로 뽑힌 문서를 다시 라벨링해야 했고 라벨러가 사람이 아닌 LLM이었습니다
      effect: nDCG@5 0.765 → 0.783 (+0.018 < 게이트) → 기각했습니다. 임베딩 교체 후 0.743 → 0.878입니다
    frames:
      - { image: media/05-1.svg, caption: 순수 벡터 vs 하이브리드 nDCG@5 (도식) }
    alternatives:
      - { name: 벡터 DB 교체 (Qdrant 등), reason: 저장소가 아니라 측정 부재가 문제였습니다 — pgvector로 충분했습니다 }
      - { name: LangChain retriever, reason: 검색 단계를 직접 측정하고 교체할 수 있어야 해서 프레임워크에 숨기지 않았습니다 }
    concept:
      title: 하이브리드 검색과 RRF란?
      body: RRF(순위 융합)는 뜻이 비슷한 글(벡터)과 글자가 겹치는 글(키워드)을 따로 찾은 뒤, 두 순위를 합쳐 최종 순위를 만드는 방식입니다. 새 임베딩에서는 오히려 −0.055로 떨어져 "임베딩이 약할 때만 이득"으로 결론을 정정했습니다.
    evidence:
      - { label: RETRIEVAL_EVAL — 게이트 판정 }
      - { label: LLM_SWAP_EVAL — 재측정 }
    proves: [search-engine, hybrid-search, rag]

  - title: 온프레미스 배포 - 앱은 k3s, 상태는 compose
    label: 온프레미스 배포 (k3s + Docker)
    summary: 자주 바뀌는 앱은 k3s에, 데이터가 든 DB는 기존 docker compose에 두어 이관을 한 번만 하도록 나눴습니다. 비용은 0원입니다.
    stats:
      problem: 프로덕션 compose 초안에서 결함 6건을 발견했습니다 — 예) DB 주소가 localhost라 메인 DB로 조용히 폴백합니다
      choice: 컴퓨트 먼저, 상태는 나중입니다. 셀렉터 없는 Service + EndpointSlice로 연결, 포트는 루프백에만 바인딩, 외부 공개는 Cloudflare Tunnel입니다
      cost: 런타임이 둘이라 브리지 네트워크를 양방향으로 배선해야 했고 컷오버 때 수 분의 다운타임이 있었습니다
      effect: 공개 health 200, 로그인 11연타 중 11번째부터 429 확인, CronJob 7종 이상 운영합니다
    frames:
      - { image: media/06-1.svg, caption: Cloudflare Tunnel → k3s → compose (도식) }
    alternatives:
      - { name: DB까지 클러스터로 이관, reason: 나중에 관리형 DB로 옮길 때 이관을 두 번 하게 됩니다 }
      - { name: HA 구성과 Helm, reason: 1인 온프레미스 규모에서 얻는 것보다 운영 비용이 큽니다 }
    concept:
      title: 왜 둘로 나눴나?
      body: 자주 교체하는 프로그램(앱)은 자동 재시작과 배포가 쉬운 관리자(k3s)에게 맡기고 데이터가 든 금고(DB)는 제자리에 둡니다. 나중에 금고를 클라우드로 옮길 때 이사를 한 번만 하려는 선택입니다.
    evidence:
      - { label: k3s 이관 기록 }
      - { label: ROADMAP — 공개 보안 점검 }
    proves: [linux-docker]

retro:
  metrics:
    - { label: 골든셋 (모델 교체 후), value: 144문항 오류 0 }
    - { label: 답변 인용률, value: "0.987" }
    - { label: 검색 nDCG@5 (임베딩 교체), value: 0.743 → 0.878 }
    - { label: 조건 질의, value: 62초 오류 → 1.5초 정답 }
    - { label: 상권 조회 인덱스, value: 2.2ms → 0.065ms }
    - { label: 커밋, value: 407개 (1인) }
  regrets:
    - 가드가 실패를 가린 사고 — 가드가 동작했는지를 따로 감시하는 지표가 필요했습니다
    - 검색 골든셋 라벨을 LLM이 달았습니다 — 사람 검수 표본을 두지 못했습니다
    - CI 없이 로컬 수동 검증에 의존했습니다 — 이 포트폴리오 저장소에서는 CI부터 붙였습니다
    - 문서마다 수치가 어긋납니다 (골든셋 134 vs 144 문항) — 수치의 단일 출처가 필요합니다
