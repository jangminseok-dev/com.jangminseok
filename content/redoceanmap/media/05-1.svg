<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="1200" height="675" fill="#181b22"/>
  <text x="40" y="60" fill="#fff" font-size="30" font-weight="700">하이브리드 검색, 측정하고 기각했다</text>
  <text x="40" y="100" fill="#9aa1ad" font-size="19">TREC pooling 골든셋 40문항 · nDCG@5 · 채택 게이트 +0.03</text>
  <line x1="120" y1="560" x2="1120" y2="560" stroke="#2a2f3a" stroke-width="2"/>
  <g font-size="20" text-anchor="middle">
    <rect x="200" y="177" width="160" height="383" rx="10" fill="#4e5968"/>
    <text x="280" y="165" fill="#fff" font-weight="700">0.765</text>
    <text x="280" y="595" fill="#fff">순수 벡터</text>
    <rect x="420" y="168" width="160" height="392" rx="10" fill="#ef4444"/>
    <text x="500" y="156" fill="#fff" font-weight="700">0.783</text>
    <text x="500" y="595" fill="#fff">trigram + 벡터 RRF</text>
  </g>
  <text x="390" y="640" fill="#ffb4b4" font-size="20" text-anchor="middle">+0.018 &lt; 게이트 +0.03 → 기각, 순수 코사인 유지</text>
  <line x1="660" y1="140" x2="660" y2="620" stroke="#2a2f3a" stroke-width="2"/>
  <text x="700" y="190" fill="#fff" font-size="24" font-weight="700">임베딩 교체 후 재측정</text>
  <text x="700" y="240" fill="#9aa1ad" font-size="20">검색 nDCG@5  0.743 → 0.878</text>
  <text x="700" y="280" fill="#9aa1ad" font-size="20">하이브리드는 오히려 −0.055</text>
  <rect x="700" y="330" width="440" height="120" rx="16" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="2"/>
  <text x="920" y="380" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">결론 정정</text>
  <text x="920" y="418" fill="#ffb4b4" font-size="19" text-anchor="middle">"임베딩이 약할 때만 이득"</text>
</svg>
