  <g stroke="#ef4444" stroke-width="3">
    <line x1="330" y1="350" x2="330" y2="170"/><line x1="330" y1="350" x2="500" y2="260"/>
    <line x1="330" y1="350" x2="500" y2="440"/><line x1="330" y1="350" x2="330" y2="530"/>
    <line x1="330" y1="350" x2="160" y2="440"/><line x1="330" y1="350" x2="160" y2="260"/>
  </g>
  <circle cx="330" cy="350" r="62" fill="#ef4444"/>
  <text x="330" y="360" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">hub</text>
  <g fill="#0f1115" stroke="#2a2f3a" stroke-width="2">
