    <rect x="440" y="415" width="120" height="50" rx="12"/><rect x="270" y="515" width="120" height="50" rx="12"/>
    <rect x="100" y="415" width="120" height="50" rx="12"/><rect x="100" y="235" width="120" height="50" rx="12"/>
  </g>
  <g fill="#fff" font-size="20" text-anchor="middle">
    <text x="330" y="162">chat</text><text x="500" y="267">market</text><text x="500" y="447">stock</text>
    <text x="330" y="547">auth</text><text x="160" y="447">admin</text><text x="160" y="267">mail</text>
  </g>
  <text x="330" y="620" fill="#9aa1ad" font-size="18" text-anchor="middle">스포크끼리 직접 import 금지 — 허브 포트로만 협력</text>
  <line x1="640" y1="90" x2="640" y2="600" stroke="#2a2f3a" stroke-width="2"/>
