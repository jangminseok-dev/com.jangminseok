name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  www:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: www/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}

  minseok:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minseok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: minseok/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q -m "not network"
      - run: PYTHONPATH=apps lint-imports --config .importlinter
